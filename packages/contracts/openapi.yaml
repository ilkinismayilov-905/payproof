  schemas:
    Uuid:
      type: string
      format: uuid
    Decimal:
      type: string
      description: Decimal amount as a string with exactly 2 fraction digits — never a float.
      pattern: "^-?(0|[1-9][0-9]*)\\.[0-9]{2}$"
      examples: ["12000.00"]
    Quantity:
      type: string
      description: Quantity as a decimal string (up to 3 fraction digits).
      pattern: "^(0|[1-9][0-9]*)(\\.[0-9]{1,3})?$"
      examples: ["800"]
    Currency:
      type: string
      enum: [AZN, USD]
      description: Amounts in different currencies are never summed or converted.
    Money:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount: { $ref: "#/components/schemas/Decimal" }
        currency: { $ref: "#/components/schemas/Currency" }
    RuleId:
      type: string
      pattern: "^R-0(0[1-9]|10)$"
      examples: ["R-001"]
    PackageStatus:
      type: string
      enum: [PROCESSING, NEEDS_REVIEW, NEEDS_FIX, READY_FOR_APPROVAL, APPROVED_READY, EXPORTED]
      description: Derived from the latest validation run, approvals and exports — never stored as truth. There is no PAID.
    CheckOutcome:
      type: string
      enum: [PASS, FAIL, UNKNOWN, NOT_APPLICABLE]
      description: UNKNOWN is never treated as PASS and blocks the package.
    TaskStatus:
      type: string
      enum: [OPEN, IN_PROGRESS, SUBMITTED_FOR_RECHECK, RESOLVED]
      description: Only the system sets RESOLVED, when the task's rule passes.
    DocumentType:
      type: string
      enum: [invoice, order, delivery]
    DocumentVersionStatus:
      type: string
      enum: [UPLOADED, PROCESSING, EXTRACTED, REVIEW_REQUIRED, FAILED]
      description: FAILED is a technical processing error, not a business FAIL.
    Role:
      type: string
      enum: [operator, approver, readonly, admin, accounting, warehouse, sales]
    Permission:
      type: string
      enum:
        [
          VIEW,
          EDIT_PACKAGE,
          MANAGE_TASKS,
          MANAGE_REQUIREMENTS,
          APPROVE_PACKAGE,
          EXPORT_PACKAGE,
          DELETE_PACKAGE,
        ]
      description: Server-side permission matrix (docs/architecture/security.md); the UI only mirrors it.
    UserRef:
      type: object
      additionalProperties: false
      required: [id, full_name, role]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        full_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
    PackageRef:
      type: object
      additionalProperties: false
      required: [id, invoice_number]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        invoice_number: { type: string, examples: ["INV-1042"] }
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - TASK_STATUS_NOT_ALLOWED
        - INVOICE_REQUIRED
        - IDEMPOTENCY_KEY_REUSED
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - VERSION_CONFLICT
        - PACKAGE_NOT_READY
        - PACKAGE_NOT_DELETABLE
        - DUPLICATE_FILE
        - DUPLICATE_INVOICE
        - IDEMPOTENCY_IN_PROGRESS
        - FILE_TOO_LARGE
        - UNSUPPORTED_FILE_TYPE
        - INTERNAL_ERROR
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string, description: "Azerbaijani; safe to show in the UI." }
            details: { type: object, additionalProperties: true }
    DevUser:
      type: object
      additionalProperties: false
      required: [id, full_name, title, role]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        full_name: { type: string }
        title: { type: string }
        role: { $ref: "#/components/schemas/Role" }
    Me:
      type: object
      additionalProperties: false
      required: [id, email, full_name, title, role, company, permissions]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        email: { type: string, format: email }
        full_name: { type: string }
        title: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        company:
          type: object
          additionalProperties: false
          required: [id, name, voen]
          properties:
            id: { $ref: "#/components/schemas/Uuid" }
            name: { type: string }
            voen: { type: string, pattern: "^[0-9]{10}$" }
        permissions:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/Permission" }
    Session:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token: { type: string }
        token_type: { const: bearer }
        expires_in: { type: integer, description: Seconds }
        user: { $ref: "#/components/schemas/Me" }
    Dashboard:
      type: object
      additionalProperties: false
      required:
        [
          as_of,
          package_count,
          customer_count,
          status_counts,
          open_problem_amounts,
          top_issue,
          rule_counts,
          problem_age,
          tasks,
          recent_approvals,
        ]
      properties:
        as_of: { type: string, format: date-time }
        package_count:
          { type: integer, description: Unique invoice packages (each invoice counted once) }
        customer_count: { type: integer }
        status_counts:
          type: object
          additionalProperties: false
          required:
            [PROCESSING, NEEDS_REVIEW, NEEDS_FIX, READY_FOR_APPROVAL, APPROVED_READY, EXPORTED]
          properties:
            PROCESSING: { type: integer }
            NEEDS_REVIEW: { type: integer }
            NEEDS_FIX: { type: integer }
            READY_FOR_APPROVAL: { type: integer }
            APPROVED_READY: { type: integer }
            EXPORTED: { type: integer }
        open_problem_amounts:
          type: array
          description: NEEDS_FIX + NEEDS_REVIEW invoice totals, one entry per currency (never converted). Not a financial loss.
          items:
            type: object
            additionalProperties: false
            required: [total, package_count]
            properties:
              total: { $ref: "#/components/schemas/Money" }
              package_count: { type: integer }
        top_issue:
          description: Most frequent primary (non-cascade) problem category among non-exported packages.
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [category, rule_ids, package_count, invoice_numbers]
              properties:
                category: { type: string }
                rule_ids: { type: array, items: { $ref: "#/components/schemas/RuleId" } }
                package_count: { type: integer }
                invoice_numbers: { type: array, items: { type: string } }
        rule_counts:
          type: array
          description: Primary blockers per rule (cascade results are not counted).
          items:
            type: object
            additionalProperties: false
            required: [rule_id, fail, unknown]
            properties:
              rule_id: { $ref: "#/components/schemas/RuleId" }
              fail: { type: integer }
              unknown: { type: integer }
        problem_age:
          type: object
          additionalProperties: false
          required: [average_days, longest]
          properties:
            average_days: { type: string, pattern: "^[0-9]+\\.[0-9]$" }
            longest:
              oneOf:
                - type: "null"
                - type: object
                  additionalProperties: false
                  required: [package, days]
                  properties:
                    package: { $ref: "#/components/schemas/PackageRef" }
                    days: { type: integer }
        tasks:
          type: object
          additionalProperties: false
          required: [resolved, total]
          properties:
            resolved: { type: integer }
            total: { type: integer }
        recent_approvals:
          type: array
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [package, version, approver, approved_at, total]
            properties:
              package: { $ref: "#/components/schemas/PackageRef" }
              version: { type: integer }
              approver: { $ref: "#/components/schemas/UserRef" }
              approved_at: { type: string, format: date-time }
              total: { $ref: "#/components/schemas/Money" }
    CustomerRef:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        name: { type: string }
    Blocker:
      type: object
      additionalProperties: false
      required: [rule_id, outcome]
      description: A primary (non-cascade) FAIL or UNKNOWN result.
      properties:
        rule_id: { $ref: "#/components/schemas/RuleId" }
        outcome: { type: string, enum: [FAIL, UNKNOWN] }
    PackageListItem:
      type: object
      additionalProperties: false
      required:
        [
          id,
          invoice_number,
          version,
          status,
          customer,
          invoice_date,
          total,
          po_ref,
          po_unreadable,
          blocking,
          owner,
          updated_at,
        ]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        invoice_number: { type: string }
        version: { type: integer, minimum: 1 }
        status: { $ref: "#/components/schemas/PackageStatus" }
        customer: { $ref: "#/components/schemas/CustomerRef" }
        invoice_date: { type: string, format: date }
        total: { $ref: "#/components/schemas/Money" }
        po_ref:
          {
            type: ["string", "null"],
            description: PO as extracted from the invoice (may not exist in the system),
          }
        po_unreadable: { type: boolean }
        blocking: { type: array, items: { $ref: "#/components/schemas/Blocker" } }
        owner: { $ref: "#/components/schemas/UserRef" }
        updated_at: { type: string, format: date-time }
    PackagePage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, total_count]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PackageListItem" } }
        next_cursor: { type: ["string", "null"] }
        total_count: { type: integer, description: Packages matching the filters (all pages) }
    RequirementSet:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          require_po,
          require_delivery,
          require_signature,
          tolerance,
          effective_from,
          approved_by,
          reason,
          created_at,
        ]
      description: Immutable customer rule set; a new version is created on every change.
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        version: { type: integer, minimum: 1 }
        require_po: { type: boolean }
        require_delivery: { type: boolean }
        require_signature: { type: boolean }
        tolerance: { $ref: "#/components/schemas/Decimal" }
        effective_from: { type: string, format: date }
        approved_by: { $ref: "#/components/schemas/UserRef" }
        reason: { type: string }
        created_at: { type: string, format: date-time }
    Evidence:
      type: object
      additionalProperties: false
      required: [document_version_id, page, quote, bbox]
      description: Source reference; a field without evidence is not considered reliable.
      properties:
        document_version_id: { $ref: "#/components/schemas/Uuid" }
        page: { type: integer, minimum: 1 }
        quote: { type: string }
        bbox:
          description: Normalised [x, y, width, height] on the page (0..1), if known.
          oneOf:
            - type: "null"
            - {
                type: array,
                items: { type: number, minimum: 0, maximum: 1 },
                minItems: 4,
                maxItems: 4,
              }
    DocumentVersion:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version_no,
          file_name,
          source_kind,
          status,
          sha256,
          uploaded_by,
          uploaded_at,
          package_version_at_upload,
        ]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        version_no: { type: integer, minimum: 1 }
        file_name: { type: string }
        source_kind: { type: string, enum: [pdf, scan, spreadsheet] }
        status: { $ref: "#/components/schemas/DocumentVersionStatus" }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        uploaded_by: { $ref: "#/components/schemas/UserRef" }
        uploaded_at: { type: string, format: date-time }
        package_version_at_upload: { type: integer, minimum: 1 }
    Document:
      type: object
      additionalProperties: false
      required: [id, type, current, history]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        type: { $ref: "#/components/schemas/DocumentType" }
        current: { $ref: "#/components/schemas/DocumentVersion" }
        history:
          type: array
          description: Previous versions, newest first (kept for audit).
          items: { $ref: "#/components/schemas/DocumentVersion" }
    ExtractedField:
      type: object
      additionalProperties: false
      required:
        [id, document_version_id, field_path, label, raw_value, value, review_status, evidence]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        document_version_id: { $ref: "#/components/schemas/Uuid" }
        field_path:
          type: string
          description: "`invoice.po_ref`, `invoice.lines[<code>].qty`, `invoice.lines[<code>].unit_price`, …"
          examples: ["invoice.lines[KY-10].unit_price"]
        label: { type: string, examples: ["KY-10 vahid qiyməti"] }
        raw_value: { type: ["string", "null"], description: Text as read from the document }
        value: { type: ["string", "null"], description: Normalised value used by the rule engine }
        review_status: { type: string, enum: [EXTRACTED, REVIEW_REQUIRED, CORRECTED] }
        evidence: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/Evidence" }] }
    MatchCandidate:
      type: object
      additionalProperties: false
      required: [order_id, po_number, order_date, total, reason]
      description: AI link suggestion — never evidence by itself; a human confirms it.
      properties:
        order_id: { $ref: "#/components/schemas/Uuid" }
        po_number: { type: string, examples: ["PO-381"] }
        order_date: { type: string, format: date }
        total: { $ref: "#/components/schemas/Money" }
        reason: { type: string }
    OrderLink:
      type: object
      additionalProperties: false
      required: [confirmed, order_id, order_po, method, confirmed_by, candidates]
      properties:
        confirmed: { type: boolean }
        order_id: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/Uuid" }] }
        order_po: { type: ["string", "null"] }
        method: { type: ["string", "null"], enum: [exact_id, human, null] }
        confirmed_by:
          description: null for an automatic exact-ID link or when not confirmed.
          oneOf: [{ type: "null" }, { $ref: "#/components/schemas/UserRef" }]
        candidates: { type: array, items: { $ref: "#/components/schemas/MatchCandidate" } }
    CheckResult:
      type: object
      additionalProperties: false
      required: [rule_id, title, outcome, cascade, message, evidence, fix_hint, data]
      description: Deterministic rule engine result (docs/architecture/rules-engine.md); every rule blocks when FAIL or UNKNOWN.
      properties:
        rule_id: { $ref: "#/components/schemas/RuleId" }
        title: { type: string }
        outcome: { $ref: "#/components/schemas/CheckOutcome" }
        cascade:
          type: boolean
          description: Could not be evaluated because of another problem — blocks, but is not a primary problem.
        message: { type: string, description: Azerbaijani; shows only computed values from `data` }
        evidence: { type: array, items: { $ref: "#/components/schemas/Evidence" } }
        fix_hint:
          type: ["string", "null"]
          enum: [edit_field, upload_invoice, upload_delivery, link_order, review_signature, null]
        data:
          type: object
          additionalProperties: true
          description: 'Computed values, e.g. `{ "line_difference": { "amount": "500.00", "currency": "AZN" } }` for R-005.'
    CheckSummary:
      type: object
      additionalProperties: false
      required: [pass, fail, unknown, not_applicable, blocking]
      properties:
        pass: { type: integer }
        fail: { type: integer }
        unknown: { type: integer }
        not_applicable: { type: integer }
        blocking:
          {
            type: array,
            description: Primary blockers,
            items: { $ref: "#/components/schemas/Blocker" },
          }
    ComparisonCell:
      type: object
      additionalProperties: false
      required: [value, state, field_id, evidence]
      properties:
        value:
          {
            type: ["string", "null"],
            description: Display value (money/quantity as decimal strings),
          }
        state: { type: string, enum: [ok, mismatch, unknown, empty] }
        field_id:
          {
            oneOf: [{ type: "null" }, { $ref: "#/components/schemas/Uuid" }],
            description: Editable extracted field,
          }
        evidence: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/Evidence" }] }
    ComparisonRow:
      type: object
      additionalProperties: false
      required: [key, group, label, invoice, order, delivery]
      properties:
        key: { type: string, examples: ["lines[KY-10].unit_price"] }
        group:
          type: ["string", "null"]
          description: 'Line group header, e.g. "KY-10 · Kərə yağı 82%, 10 kq blok".'
        label: { type: string }
        invoice: { $ref: "#/components/schemas/ComparisonCell" }
        order: { $ref: "#/components/schemas/ComparisonCell" }
        delivery: { $ref: "#/components/schemas/ComparisonCell" }
    ApprovalRecord:
      type: object
      additionalProperties: false
      required:
        [
          id,
          package_version,
          requirement_set_version,
          approver,
          approved_at,
          valid,
          invalidated_reason,
          invalidated_at,
        ]
      description: Approval of one package version under one rule set version. Not a payment approval.
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        package_version: { type: integer, minimum: 1 }
        requirement_set_version: { type: integer, minimum: 1 }
        approver: { $ref: "#/components/schemas/UserRef" }
        approved_at: { type: string, format: date-time }
        valid: { type: boolean }
        invalidated_reason: { type: ["string", "null"] }
        invalidated_at: { type: ["string", "null"], format: date-time }
    ExportRecord:
      type: object
      additionalProperties: false
      required: [id, package_version, requirement_set_version, created_by, created_at, files]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        package_version: { type: integer, minimum: 1 }
        requirement_set_version: { type: integer, minimum: 1 }
        created_by: { $ref: "#/components/schemas/UserRef" }
        created_at: { type: string, format: date-time }
        files:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [document_version_id, type, file_name]
            properties:
              document_version_id: { $ref: "#/components/schemas/Uuid" }
              type: { $ref: "#/components/schemas/DocumentType" }
              file_name: { type: string }
    Task:
      type: object
      additionalProperties: false
      required:
        [
          id,
          number,
          package,
          rule_id,
          assignee,
          step,
          due_date,
          status,
          comment,
          created_at,
          created_by,
          resolved_at,
        ]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        number: { type: string, examples: ["T-118"] }
        package: { $ref: "#/components/schemas/PackageRef" }
        rule_id: { $ref: "#/components/schemas/RuleId" }
        assignee: { $ref: "#/components/schemas/UserRef" }
        step: { type: string, description: Required action }
        due_date: { type: string, format: date }
        status: { $ref: "#/components/schemas/TaskStatus" }
        comment: { type: ["string", "null"] }
        created_at: { type: string, format: date-time }
        created_by: { $ref: "#/components/schemas/UserRef" }
        resolved_at: { type: ["string", "null"], format: date-time }
    PackagePermissions:
      type: object
      additionalProperties: false
      required: [can_edit, can_manage_tasks, can_approve, can_export, can_delete]
      description: UI hint = role permission AND current state allows it. The server re-checks every request.
      properties:
        can_edit: { type: boolean }
        can_manage_tasks: { type: boolean }
        can_approve: { type: boolean }
        can_export: { type: boolean }
        can_delete: { type: boolean }
    PackageDetail:
      type: object
      additionalProperties: false
      required:
        [
          id,
          invoice_number,
          version,
          status,
          processing,
          customer,
          invoice_date,
          owner,
          created_at,
          updated_at,
          total,
          requirement_set,
          link,
          documents,
          fields,
          comparison,
          checks,
          summary,
          current_approval,
          approvals,
          exports,
          tasks,
          permissions,
        ]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        invoice_number: { type: string }
        version:
          { type: integer, minimum: 1, description: Send as `expected_version` in every change }
        status: { $ref: "#/components/schemas/PackageStatus" }
        processing: { type: boolean }
        customer: { $ref: "#/components/schemas/CustomerRef" }
        invoice_date: { type: string, format: date }
        owner: { $ref: "#/components/schemas/UserRef" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        total: { $ref: "#/components/schemas/Money" }
        requirement_set: { $ref: "#/components/schemas/RequirementSet" }
        link: { $ref: "#/components/schemas/OrderLink" }
        documents: { type: array, items: { $ref: "#/components/schemas/Document" } }
        fields: { type: array, items: { $ref: "#/components/schemas/ExtractedField" } }
        comparison:
          type: object
          additionalProperties: false
          required: [rows]
          properties:
            rows: { type: array, items: { $ref: "#/components/schemas/ComparisonRow" } }
        checks: { type: array, items: { $ref: "#/components/schemas/CheckResult" } }
        summary: { $ref: "#/components/schemas/CheckSummary" }
        current_approval:
          description: Valid approval for the current version and rule set, if any.
          oneOf: [{ type: "null" }, { $ref: "#/components/schemas/ApprovalRecord" }]
        approvals:
          {
            type: array,
            description: All approvals incl. invalidated ones,
            items: { $ref: "#/components/schemas/ApprovalRecord" },
          }
        exports: { type: array, items: { $ref: "#/components/schemas/ExportRecord" } }
        tasks: { type: array, items: { $ref: "#/components/schemas/Task" } }
        permissions: { $ref: "#/components/schemas/PackagePermissions" }
    JobAccepted:
      type: object
      additionalProperties: false
      required: [job_id]
      properties:
        job_id: { $ref: "#/components/schemas/Uuid" }
        package_id: { $ref: "#/components/schemas/Uuid" }
        document_id: { $ref: "#/components/schemas/Uuid" }
        document_version_id: { $ref: "#/components/schemas/Uuid" }
    Job:
      type: object
      additionalProperties: false
      required: [id, kind, status, created_at, updated_at, result, error]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        kind: { type: string, enum: [extract_document, create_package] }
        status: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        result:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [package_id, package_version]
              properties:
                package_id: { $ref: "#/components/schemas/Uuid" }
                package_version: { type: integer }
                document_version_id: { $ref: "#/components/schemas/Uuid" }
        error:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [code, message]
              properties:
                code: { type: string }
                message: { type: string }
    SignedUrl:
      type: object
      additionalProperties: false
      required: [url, expires_at]
      properties:
        url: { type: string, format: uri }
        expires_at: { type: string, format: date-time }
    VersionedRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version:
          {
            type: integer,
            minimum: 1,
            description: Current package version; otherwise 409 VERSION_CONFLICT,
          }
    ExportResult:
      type: object
      additionalProperties: false
      required: [export, download]
      properties:
        export: { $ref: "#/components/schemas/ExportRecord" }
        download: { $ref: "#/components/schemas/SignedUrl" }
    InternalReport:
      type: object
      additionalProperties: false
      required:
        [
          package,
          version,
          status,
          requirement_set_version,
          generated_at,
          summary,
          checks,
          approvals,
          exports,
        ]
      properties:
        package: { $ref: "#/components/schemas/PackageRef" }
        version: { type: integer, minimum: 1 }
        status: { $ref: "#/components/schemas/PackageStatus" }
        requirement_set_version: { type: integer, minimum: 1 }
        generated_at: { type: string, format: date-time }
        summary: { $ref: "#/components/schemas/CheckSummary" }
        checks: { type: array, items: { $ref: "#/components/schemas/CheckResult" } }
        approvals: { type: array, items: { $ref: "#/components/schemas/ApprovalRecord" } }
        exports: { type: array, items: { $ref: "#/components/schemas/ExportRecord" } }
    AuditEvent:
      type: object
      additionalProperties: false
      required:
        [
          id,
          created_at,
          actor,
          action,
          message,
          package,
          package_version,
          object_type,
          object_id,
          details,
        ]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        created_at: { type: string, format: date-time }
        actor:
          {
            description: null = system,
            oneOf: [{ type: "null" }, { $ref: "#/components/schemas/UserRef" }],
          }
        action: { type: string, pattern: "^[a-z_]+\\.[a-z_]+$", examples: ["package.approved"] }
        message: { type: string, description: Azerbaijani summary (no document text) }
        package: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/PackageRef" }] }
        package_version: { type: ["integer", "null"] }
        object_type: { type: string, examples: ["approval"] }
        object_id: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/Uuid" }] }
        details: { type: object, additionalProperties: true }
    AuditPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
        next_cursor: { type: ["string", "null"] }
    Customer:
      type: object
      additionalProperties: false
      required: [id, name, external_id, voen, current_requirements]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        name: { type: string }
        external_id: { type: string }
        voen: { type: string, pattern: "^[0-9]{10}$" }
        current_requirements: { $ref: "#/components/schemas/RequirementSet" }
    Notification:
      type: object
      additionalProperties: false
      required: [id, text, package, created_at, read_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        text: { type: string }
        package: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/PackageRef" }] }
        created_at: { type: string, format: date-time }
        read_at: { type: ["string", "null"], format: date-time }
