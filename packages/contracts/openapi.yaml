openapi: 3.1.0
info:
  title: PayProof API
  version: 0.1.0
  description: |
    PayProof P0 API contract — the single source of truth (docs/architecture/api-contract.md).
    Conventions: `snake_case` fields; money is a decimal **string** with its currency, never a float;
    quantities are strings; timestamps are ISO 8601 UTC. Changes only via `/contract-change`
    (docs/progress/CONTRACT-CHANGELOG.md). Example IDs are illustrative and mirror fixtures/.
servers:
  - url: http://localhost:8000
    description: Local API
security:
  - bearerAuth: []
tags:
  - name: auth
    description: Session and current user
paths:
  /v1/auth/dev-users:
    get:
      tags: [auth]
      operationId: listDevUsers
      summary: Demo users for the dev login picker (ENV=dev only; 404 otherwise)
      security: []
      responses:
        "200":
          description: Demo users
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DevUser" } }
              example:
                items:
                  - {
                      id: 0193a000-0000-7000-8000-000000000001,
                      full_name: Aygün Məmmədova,
                      title: Maliyyə əməkdaşı,
                      role: operator,
                    }
                  - {
                      id: 0193a000-0000-7000-8000-000000000002,
                      full_name: Rəşad Əliyev,
                      title: Maliyyə direktoru,
                      role: approver,
                    }
                  - {
                      id: 0193a000-0000-7000-8000-000000000005,
                      full_name: Kamran Babayev,
                      title: Daxili auditor,
                      role: readonly,
                    }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/auth/dev-login:
    post:
      tags: [auth]
      operationId: devLogin
      summary: Issue a JWT for a demo user (ENV=dev only; 404 otherwise)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [user_id]
              properties:
                user_id: { $ref: "#/components/schemas/Uuid" }
            example: { user_id: 0193a000-0000-7000-8000-000000000001 }
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
              example:
                access_token: eyJhbGciOiJIUzI1NiJ9.demo.signature
                token_type: bearer
                expires_in: 28800
                user: &me_u1
                  id: 0193a000-0000-7000-8000-000000000001
                  email: aygun.mammadova@a-distribusiya.test
                  full_name: Aygün Məmmədova
                  title: Maliyyə əməkdaşı
                  role: operator
                  company:
                    {
                      id: 0193a000-0000-7000-8000-00000000c0a1,
                      name: A Distribusiya MMC,
                      voen: "1700123451",
                    }
                  permissions: [VIEW, EDIT_PACKAGE, MANAGE_TASKS, EXPORT_PACKAGE, DELETE_PACKAGE]
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Current user, company and permissions
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
              example: *me_u1
        "401": { $ref: "#/components/responses/Unauthenticated" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Tenant comes from the membership in the token; `company_id` is never accepted in a body.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated UUID, created once per user intent and reused on retries. A replay returns the
        original response without a new event. Same key with a different body → 422 `IDEMPOTENCY_KEY_REUSED`;
        while the first request is still running → 409 `IDEMPOTENCY_IN_PROGRESS`.
      schema: { type: string, format: uuid }
      example: 6f1d2c3b-4a5e-4f60-9a7b-8c9d0e1f2a3b
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from `next_cursor` of the previous page.
      schema: { type: string }

  responses:
    Unauthenticated:
      description: Missing or invalid token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            {
              error:
                {
                  code: UNAUTHENTICATED,
                  message: "Sessiya bitib. Yenidən daxil olun.",
                  details: {},
                },
            }
    Forbidden:
      description: The role has no permission for this action (checked on the server).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            {
              error:
                {
                  code: FORBIDDEN,
                  message: "Hazır paketi yalnız təsdiqçi rolu təsdiqləyə bilər.",
                  details: {},
                },
            }
    NotFound:
      description: Not found — also returned for objects of another tenant (never 403).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: NOT_FOUND, message: "Obyekt tapılmadı.", details: {} } }
    Conflict:
      description: Version conflict, wrong state, duplicate or an idempotent request still in progress.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: VERSION_CONFLICT
              message: "Paket v3-ə yenilənib; səhifəni yeniləyin."
              details: { current_version: 3, expected_version: 2 }
    ValidationError:
      description: Request is syntactically valid but not acceptable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: VALIDATION_ERROR
              message: "Sorğuda xəta var."
              details: { fields: { reason: "Səbəb məcburidir." } }

  schemas:
    Uuid:
      type: string
      format: uuid
    Decimal:
      type: string
      description: Decimal amount as a string with exactly 2 fraction digits — never a float.
      pattern: "^-?(0|[1-9][0-9]*)\\.[0-9]{2}$"
      examples: ["12000.00"]
    Quantity:
      type: string
      description: Quantity as a decimal string (up to 3 fraction digits).
      pattern: "^(0|[1-9][0-9]*)(\\.[0-9]{1,3})?$"
      examples: ["800"]
    Currency:
      type: string
      enum: [AZN, USD]
      description: Amounts in different currencies are never summed or converted.
    Money:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount: { $ref: "#/components/schemas/Decimal" }
        currency: { $ref: "#/components/schemas/Currency" }
    RuleId:
      type: string
      pattern: "^R-0(0[1-9]|10)$"
      examples: ["R-001"]
    PackageStatus:
      type: string
      enum: [PROCESSING, NEEDS_REVIEW, NEEDS_FIX, READY_FOR_APPROVAL, APPROVED_READY, EXPORTED]
      description: Derived from the latest validation run, approvals and exports — never stored as truth. There is no PAID.
    CheckOutcome:
      type: string
      enum: [PASS, FAIL, UNKNOWN, NOT_APPLICABLE]
      description: UNKNOWN is never treated as PASS and blocks the package.
    TaskStatus:
      type: string
      enum: [OPEN, IN_PROGRESS, SUBMITTED_FOR_RECHECK, RESOLVED]
      description: Only the system sets RESOLVED, when the task's rule passes.
    DocumentType:
      type: string
      enum: [invoice, order, delivery]
    DocumentVersionStatus:
      type: string
      enum: [UPLOADED, PROCESSING, EXTRACTED, REVIEW_REQUIRED, FAILED]
      description: FAILED is a technical processing error, not a business FAIL.
    Role:
      type: string
      enum: [operator, approver, readonly, admin, accounting, warehouse, sales]
    Permission:
      type: string
      enum:
        [
          VIEW,
          EDIT_PACKAGE,
          MANAGE_TASKS,
          MANAGE_REQUIREMENTS,
          APPROVE_PACKAGE,
          EXPORT_PACKAGE,
          DELETE_PACKAGE,
        ]
      description: Server-side permission matrix (docs/architecture/security.md); the UI only mirrors it.
    UserRef:
      type: object
      additionalProperties: false
      required: [id, full_name, role]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        full_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
    PackageRef:
      type: object
      additionalProperties: false
      required: [id, invoice_number]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        invoice_number: { type: string, examples: ["INV-1042"] }
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - TASK_STATUS_NOT_ALLOWED
        - INVOICE_REQUIRED
        - IDEMPOTENCY_KEY_REUSED
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - VERSION_CONFLICT
        - PACKAGE_NOT_READY
        - PACKAGE_NOT_DELETABLE
        - DUPLICATE_FILE
        - DUPLICATE_INVOICE
        - IDEMPOTENCY_IN_PROGRESS
        - FILE_TOO_LARGE
        - UNSUPPORTED_FILE_TYPE
        - INTERNAL_ERROR
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string, description: "Azerbaijani; safe to show in the UI." }
            details: { type: object, additionalProperties: true }
    DevUser:
      type: object
      additionalProperties: false
      required: [id, full_name, title, role]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        full_name: { type: string }
        title: { type: string }
        role: { $ref: "#/components/schemas/Role" }
    Me:
      type: object
      additionalProperties: false
      required: [id, email, full_name, title, role, company, permissions]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        email: { type: string, format: email }
        full_name: { type: string }
        title: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        company:
          type: object
          additionalProperties: false
          required: [id, name, voen]
          properties:
            id: { $ref: "#/components/schemas/Uuid" }
            name: { type: string }
            voen: { type: string, pattern: "^[0-9]{10}$" }
        permissions:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/Permission" }
    Session:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token: { type: string }
        token_type: { const: bearer }
        expires_in: { type: integer, description: Seconds }
        user: { $ref: "#/components/schemas/Me" }
