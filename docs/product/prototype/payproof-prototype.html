<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>PayProof — MVP prototip</title>
<style>
/* =========================================================
   1. DESIGN TOKENS
   ========================================================= */
:root{
  --brand-700:#0A4A55; --brand-600:#0D5D6B; --brand-500:#167487; --brand-100:#CFE6EA; --brand-50:#EAF4F6; --on-brand:#FFFFFF;
  --bg:#F4F5F2; --surface:#FFFFFF; --surface-2:#F1F3EF; --surface-3:#E6E9E4; --border:#DCE0DA; --border-strong:#C3C9C1;
  --text:#17201D; --text-2:#46524E; --text-3:#5F6B66;
  --success:#17784A; --success-bg:#E5F3EB; --warning:#8F5600; --warning-bg:#FCF0D9;
  --danger:#B42318; --danger-bg:#FBE8E6; --on-danger:#FFFFFF; --info:#3A57A0; --info-bg:#E9EEF9;
  --neutral:#4D5754; --neutral-bg:#ECEEEA;
  --av-1:#D7ECEF; --av-1t:#0A4A55; --av-2:#F6E3CF; --av-2t:#7A3E05; --av-3:#E2E7F6; --av-3t:#2E4580;
  --av-4:#E5F0DD; --av-4t:#33561C; --av-5:#F3E0E6; --av-5t:#7D2643;
  --paper:#FFFFFF; --paper-ink:#1D2321; --paper-line:#E3E5E0; --paper-muted:#5E6662; --paper-hl:#FFE27A; --paper-hl-ring:#D9A400; --paper-scan:#F6F3EA;
  --overlay:rgba(12,18,16,.48); --stage-glow:#DCEDEF;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px; --sp-10:40px; --sp-12:48px;
  --fs-xs:12px; --fs-sm:13px; --fs-md:14px; --fs-lg:16px; --fs-xl:18px; --fs-2xl:22px; --fs-3xl:28px; --fs-4xl:34px;
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-xl:20px; --r-full:999px;
  --sh-1:0 1px 2px rgba(20,30,27,.06),0 1px 3px rgba(20,30,27,.05);
  --sh-2:0 6px 16px rgba(20,30,27,.08),0 2px 4px rgba(20,30,27,.05);
  --sh-3:0 24px 48px rgba(20,30,27,.18),0 6px 12px rgba(20,30,27,.08);
  --dur:180ms; --ease:cubic-bezier(.2,.7,.3,1);
  --font:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --topbar-h:56px;
}
@media (prefers-color-scheme:dark){
  :root{
    --brand-700:#8CD7E2; --brand-600:#5CC3D2; --brand-500:#3AA9BA; --brand-100:#1B4650; --brand-50:#10292F; --on-brand:#06262C;
    --bg:#0E1312; --surface:#151C1A; --surface-2:#1B2321; --surface-3:#25302D; --border:#2B3633; --border-strong:#3D4A46;
    --text:#E7EDEB; --text-2:#B8C3BF; --text-3:#97A39E;
    --success:#62CC91; --success-bg:#12301F; --warning:#EDB458; --warning-bg:#33260D;
    --danger:#F4877C; --danger-bg:#3A1714; --on-danger:#2B0B08; --info:#9DB2F2; --info-bg:#1A2340;
    --neutral:#B8C3BF; --neutral-bg:#222B29;
    --av-1:#163A40; --av-1t:#9EE0EA; --av-2:#3D2A14; --av-2t:#F3C48F; --av-3:#1F2A4A; --av-3t:#B5C6F5;
    --av-4:#22341A; --av-4t:#B8DE9E; --av-5:#3D1B27; --av-5t:#F2AFC4;
    --overlay:rgba(0,0,0,.62); --stage-glow:#13292D;
    --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 6px 16px rgba(0,0,0,.45); --sh-3:0 24px 48px rgba(0,0,0,.6);
  }
}

/* =========================================================
   2. BASE / RESET
   ========================================================= */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);font-size:var(--fs-md);line-height:1.5;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2,h3,h4,p,ol,ul,figure{margin:0}
ol,ul{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
a{color:var(--brand-600);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--brand-500);outline-offset:2px}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--text-3)} .sm{font-size:var(--fs-sm)} .xs{font-size:var(--fs-xs)} .b{font-weight:600}
.mono{font-family:var(--mono);font-size:.92em}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.row{display:flex;align-items:center;gap:var(--sp-2)} .wrap{flex-wrap:wrap} .grow{flex:1;min-width:0} .between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:var(--sp-3)}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes shim{to{background-position:-200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--paper-hl-ring)}100%{box-shadow:0 0 0 8px transparent}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;transition-duration:1ms!important}}

/* =========================================================
   3. SHARED COMPONENTS
   ========================================================= */
/* Top bar (platform toggle) */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar-h);z-index:60;display:flex;align-items:center;gap:var(--sp-4);padding:0 var(--sp-5);background:var(--surface);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;color:var(--text);font-weight:700;font-size:var(--fs-lg);letter-spacing:-.01em}
.brand:hover{text-decoration:none}
.logo{width:30px;height:30px;border-radius:9px;background:var(--brand-600);color:var(--on-brand);display:grid;place-items:center}
.logo .ic{width:18px;height:18px;stroke-width:2.4}
.tag-demo{font-size:var(--fs-xs);font-weight:600;color:var(--warning);background:var(--warning-bg);padding:2px 8px;border-radius:var(--r-full)}
.seg{display:inline-flex;padding:3px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);gap:2px}
.seg button{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:8px;font-weight:600;font-size:var(--fs-sm);color:var(--text-2);transition:background var(--dur),color var(--dur)}
.seg button:hover{color:var(--text)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:var(--sh-1)}
.seg .ic{width:16px;height:16px}
.tb-mid{flex:1;display:flex;justify-content:center}
.tb-end{display:flex;gap:var(--sp-2);align-items:center}
.seg button{white-space:nowrap}
@media (max-width:760px){.tag-demo,.brand-name,.tb-end .tb-l{display:none}.topbar{padding:0 var(--sp-3);gap:var(--sp-2)}.seg button{padding:0 10px}}
@media (max-width:480px){.seg button{padding:0 8px;font-size:12px;gap:4px}.tb-end .btn{padding:0 9px}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);height:38px;padding:0 var(--sp-4);border-radius:var(--r-md);font-weight:600;font-size:var(--fs-md);border:1px solid transparent;transition:background var(--dur) var(--ease),border-color var(--dur),color var(--dur),box-shadow var(--dur),transform var(--dur);white-space:nowrap;user-select:none;text-align:center}
.btn:hover{text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn .ic{width:16px;height:16px}
.btn-primary{background:var(--brand-600);color:var(--on-brand)}
.btn-primary:hover{background:var(--brand-700)}
.btn-secondary{background:var(--surface);border-color:var(--border-strong);color:var(--text)}
.btn-secondary:hover{background:var(--surface-2)}
.btn-ghost{color:var(--text-2)}
.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.btn-danger{background:var(--danger);color:var(--on-danger)}
.btn-danger:hover{filter:brightness(.93)}
.btn-success{background:var(--success);color:var(--on-brand)}
.btn-sm{height:32px;padding:0 var(--sp-3);font-size:var(--fs-sm)}
.btn-lg{height:50px;font-size:var(--fs-lg);padding:0 var(--sp-5);border-radius:var(--r-lg)}
.btn-block{width:100%}
.btn[aria-disabled="true"],.btn:disabled{opacity:.48;cursor:not-allowed}
.btn.loading{pointer-events:none;opacity:.8}
.icon-btn{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r-md);color:var(--text-2);position:relative;transition:background var(--dur),color var(--dur);flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn .ic{width:20px;height:20px}
.cnt{position:absolute;top:4px;right:3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--danger);color:var(--on-danger);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1;border:2px solid var(--surface)}
.link-btn{color:var(--brand-600);font-weight:600;font-size:var(--fs-sm);display:inline-flex;gap:4px;align-items:center;min-height:32px}
.link-btn:hover{text-decoration:underline}

/* Cards, panels */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-1)}
.pad{padding:var(--sp-5)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-1);padding:var(--sp-4);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);margin-bottom:var(--sp-3)}
.panel-h h2,.panel-h h3{font-size:var(--fs-lg);font-weight:700}
.eyebrow{font-size:var(--fs-xs);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-600)}
.divider{height:1px;background:var(--border);margin:var(--sp-4) 0}

/* Badges & tags */
.badge{display:inline-flex;align-items:center;gap:5px;min-height:24px;padding:2px 9px;border-radius:var(--r-full);font-size:var(--fs-xs);font-weight:600;white-space:nowrap;border:1px solid transparent;line-height:1.3}
.badge .ic{width:13px;height:13px;stroke-width:2.4}
.b-success{background:var(--success-bg);color:var(--success)}
.b-warning{background:var(--warning-bg);color:var(--warning)}
.b-danger{background:var(--danger-bg);color:var(--danger)}
.b-info{background:var(--info-bg);color:var(--info)}
.b-neutral{background:var(--neutral-bg);color:var(--neutral)}
.b-brand{background:var(--brand-50);color:var(--brand-700)}
.b-outline{border-color:var(--border-strong);color:var(--text-2);background:transparent}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:1px 7px;border-radius:var(--r-sm);background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}

/* Avatars */
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.av.lg{width:44px;height:44px;font-size:15px}
.av.xl{width:64px;height:64px;font-size:22px}
.av-1{background:var(--av-1);color:var(--av-1t)} .av-2{background:var(--av-2);color:var(--av-2t)} .av-3{background:var(--av-3);color:var(--av-3t)}
.av-4{background:var(--av-4);color:var(--av-4t)} .av-5{background:var(--av-5);color:var(--av-5t)} .av-sys{background:var(--neutral-bg);color:var(--neutral)}
.av-sys .ic{width:15px;height:15px}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:var(--sp-4)}
.field>label,.lbl{font-size:var(--fs-sm);font-weight:600;color:var(--text-2)}
.input,.select,.textarea{width:100%;min-height:40px;padding:0 var(--sp-3);border:1px solid var(--border-strong);border-radius:var(--r-md);background:var(--surface);transition:border-color var(--dur),box-shadow var(--dur)}
.textarea{min-height:84px;padding:10px var(--sp-3);resize:vertical;line-height:1.45}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--brand-500);box-shadow:0 0 0 3px var(--brand-100)}
.field.has-err .input,.field.has-err .select,.field.has-err .textarea{border-color:var(--danger)}
.err{color:var(--danger);font-size:var(--fs-xs);font-weight:600;display:none;gap:4px;align-items:center}
.field.has-err .err{display:flex}
.err .ic{width:14px;height:14px}
.hint{color:var(--text-3);font-size:var(--fs-xs)}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:var(--fs-md)}
.check input{width:20px;height:20px;accent-color:var(--brand-600);margin:1px 0 0;flex:none}
.radio-card{display:flex;gap:12px;align-items:flex-start;padding:var(--sp-3) var(--sp-4);border:1px solid var(--border);border-radius:var(--r-md);cursor:pointer;transition:border-color var(--dur),background var(--dur);margin-bottom:var(--sp-2)}
.radio-card:hover{border-color:var(--border-strong)}
.radio-card:has(input:checked){border-color:var(--brand-500);background:var(--brand-50)}
.radio-card input{margin-top:3px;width:18px;height:18px;accent-color:var(--brand-600);flex:none}
.radio-card.disabled{opacity:.72}
.switch{position:relative;display:inline-flex;align-items:center;gap:12px;cursor:pointer;min-height:44px}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .tr{width:40px;height:24px;border-radius:12px;background:var(--border-strong);position:relative;transition:background var(--dur);flex:none}
.switch .tr::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:var(--sh-1);transition:transform var(--dur) var(--ease)}
.switch input:checked+.tr{background:var(--brand-600)}
.switch input:checked+.tr::after{transform:translateX(16px)}
.switch input:focus-visible+.tr{outline:2px solid var(--brand-500);outline-offset:2px}
.search-f{position:relative;display:flex;align-items:center;flex:1;min-width:200px}
.search-f .ic{position:absolute;left:12px;color:var(--text-3);width:16px;height:16px;pointer-events:none}
.search-f .input{padding-left:36px}

/* Tables */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.table{width:100%;border-collapse:collapse}
.table th{text-align:left;font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.04em;color:var(--text-3);font-weight:700;padding:10px var(--sp-4);border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap}
.table td{padding:12px var(--sp-4);border-bottom:1px solid var(--border);vertical-align:middle}
.table tbody tr:last-child td{border-bottom:0}
.table tbody tr{transition:background var(--dur)}
.table tbody tr.clickable{cursor:pointer}
.table tbody tr.clickable:hover{background:var(--surface-2)}
.table .r{text-align:right}
.th-sort{display:inline-flex;gap:4px;align-items:center;text-transform:inherit;letter-spacing:inherit;font-weight:inherit;color:inherit;min-height:24px}
.th-sort:hover{color:var(--text)}
.th-sort .ic{width:13px;height:13px;opacity:.55}
.th-sort.on .ic{opacity:1;color:var(--brand-600)}
.cell-main{font-weight:600;color:var(--text)}
.cell-sub{font-size:var(--fs-xs);color:var(--text-3)}
.blk{display:inline-flex;gap:4px;align-items:center;font-weight:700;color:var(--danger)}
.blk .ic{width:15px;height:15px}

/* Modal */
.modal-back{position:fixed;inset:0;background:var(--overlay);z-index:100;display:flex;align-items:center;justify-content:center;padding:var(--sp-4);animation:fade var(--dur)}
.modal{background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--sh-3);width:min(560px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;animation:pop 220ms var(--ease);border:1px solid var(--border)}
.modal.lg{width:min(940px,100%)}
.modal-h{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-4);padding:var(--sp-5) var(--sp-6) var(--sp-3)}
.modal-h h2{font-size:var(--fs-xl);line-height:1.3}
.modal-h p{color:var(--text-2);font-size:var(--fs-sm);margin-top:2px}
.modal-b{padding:var(--sp-2) var(--sp-6) var(--sp-5);overflow:auto}
.modal-f{display:flex;justify-content:flex-end;gap:var(--sp-2);padding:var(--sp-4) var(--sp-6);border-top:1px solid var(--border);flex-wrap:wrap}

/* Toasts */
#toasts{position:fixed;right:var(--sp-5);bottom:var(--sp-5);z-index:400;display:flex;flex-direction:column;gap:var(--sp-2);width:min(380px,calc(100vw - 32px))}
.toast{display:flex;gap:10px;align-items:flex-start;padding:12px 12px 12px 14px;border-radius:var(--r-md);background:var(--surface);color:var(--text);border:1px solid var(--border);border-left:4px solid var(--tc,var(--brand-600));box-shadow:var(--sh-3);animation:pop 200ms var(--ease);font-size:var(--fs-sm)}
.toast>.ic{color:var(--tc,var(--brand-600));margin-top:1px}
.toast .grow{padding-top:1px}
.toast.success{--tc:var(--success)} .toast.error{--tc:var(--danger)} .toast.warn{--tc:var(--warning)} .toast.info{--tc:var(--info)}
.toast .icon-btn{width:28px;height:28px;margin:-4px -4px 0 0}
.toast .icon-btn .ic{width:16px;height:16px}

/* Loading, empty */
.skel{background:linear-gradient(90deg,var(--surface-2) 0%,var(--surface-3) 50%,var(--surface-2) 100%);background-size:200% 100%;animation:shim 1.1s linear infinite;border-radius:var(--r-sm)}
.spin{animation:spin .8s linear infinite}
.empty{text-align:center;padding:var(--sp-10) var(--sp-6);color:var(--text-2);display:flex;flex-direction:column;align-items:center;gap:var(--sp-2)}
.empty>.ic{width:40px;height:40px;color:var(--text-3);stroke-width:1.6}
.empty h3{font-size:var(--fs-lg);color:var(--text)}
.empty p{max-width:360px;font-size:var(--fs-sm)}

/* Banners */
.banner{display:flex;gap:var(--sp-3);align-items:flex-start;padding:var(--sp-4);border-radius:var(--r-lg);border:1px solid transparent}
.banner>.ic{width:22px;height:22px;margin-top:1px}
.banner h3{font-size:var(--fs-md);font-weight:700}
.banner p{font-size:var(--fs-sm);color:var(--text-2);margin-top:2px}
.banner.danger{background:var(--danger-bg);border-color:color-mix(in srgb,var(--danger) 25%,transparent)} .banner.danger>.ic{color:var(--danger)}
.banner.warning{background:var(--warning-bg);border-color:color-mix(in srgb,var(--warning) 25%,transparent)} .banner.warning>.ic{color:var(--warning)}
.banner.success{background:var(--success-bg);border-color:color-mix(in srgb,var(--success) 25%,transparent)} .banner.success>.ic{color:var(--success)}
.banner.brand{background:var(--brand-50);border-color:color-mix(in srgb,var(--brand-600) 25%,transparent)} .banner.brand>.ic{color:var(--brand-600)}
.banner.neutral{background:var(--surface-2);border-color:var(--border)} .banner.neutral>.ic{color:var(--text-2)}
.banner .acts{margin-left:auto;display:flex;gap:var(--sp-2);flex-wrap:wrap}

/* Evidence & checks */
.chk{border:1px solid var(--border);border-radius:var(--r-md);padding:var(--sp-3);background:var(--surface);border-left:4px solid var(--cc,var(--border-strong))}
.chk+.chk{margin-top:var(--sp-2)}
.chk.FAIL{--cc:var(--danger)} .chk.UNKNOWN{--cc:var(--warning)} .chk.PASS{--cc:var(--success)} .chk.NOT_APPLICABLE{--cc:var(--border-strong)}
.chk h4{font-size:var(--fs-md);margin:6px 0 2px}
.chk p{font-size:var(--fs-sm);color:var(--text-2)}
.chk-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chk-id{font-family:var(--mono);font-size:var(--fs-xs);color:var(--text-3)}
.chk-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:var(--sp-2)}
.chk.compact{display:flex;gap:8px;align-items:center;padding:8px 10px}
.chk.compact .grow{font-size:var(--fs-sm)}
.chk.compact .ic{width:16px;height:16px}
.out-ic.PASS{color:var(--success)} .out-ic.FAIL{color:var(--danger)} .out-ic.UNKNOWN{color:var(--warning)} .out-ic.NOT_APPLICABLE{color:var(--text-3)}
.evs{display:flex;flex-direction:column;gap:6px;margin-top:var(--sp-2)}
.ev-link{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--border);font-size:var(--fs-xs);color:var(--text-2);text-align:left;transition:border-color var(--dur),background var(--dur);width:100%;min-height:36px}
.ev-link:hover{border-color:var(--brand-500);background:var(--brand-50)}
.ev-link .ic{width:15px;height:15px;color:var(--brand-600);margin-top:1px}
.ev-link b{display:block;color:var(--text);font-weight:600}
.ev-link q{font-family:var(--mono);quotes:"“" "”"}
.sumbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:var(--sp-3)}
.grp-t{font-size:var(--fs-xs);font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);margin:var(--sp-4) 0 var(--sp-2)}
.grp-t:first-of-type{margin-top:0}
details>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;min-height:32px;font-size:var(--fs-sm);font-weight:600;color:var(--text-2)}
details>summary::-webkit-details-marker{display:none}
details>summary .ic{width:15px;height:15px;transition:transform var(--dur)}
details[open]>summary .ic{transform:rotate(90deg)}

/* Paper document (source viewer) */
.paper{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.12);padding:28px;font-size:12.5px;line-height:1.45;position:relative}
.paper.scan{background:var(--paper-scan);transform:rotate(-.4deg)}
.paper-h{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid var(--paper-ink);padding-bottom:10px;margin-bottom:12px}
.paper-h small{display:block;color:var(--paper-muted);font-size:10.5px}
.paper-t{text-align:right;font-weight:800;letter-spacing:.06em;font-size:11px}
.paper-t b{display:block;font-size:15px;letter-spacing:0}
.paper-meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
.paper-meta>div{padding:2px 4px;border-radius:2px}
.paper table{width:100%;border-collapse:collapse;margin:12px 0}
.paper th,.paper td{border-bottom:1px solid var(--paper-line);padding:5px 4px;text-align:left}
.paper th{font-size:10.5px;color:var(--paper-muted);font-weight:700}
.paper td.r,.paper th.r{text-align:right}
.paper .tot{display:flex;justify-content:flex-end;gap:16px;font-weight:700;padding:4px}
.paper .hl{background:var(--paper-hl);box-shadow:0 0 0 2px var(--paper-hl-ring);border-radius:2px;animation:pulse 1.2s ease-out 2}
.paper .blurred{filter:blur(2.4px)}
.paper-sig{display:flex;gap:24px;margin-top:18px;align-items:flex-end}
.paper-sig>div{flex:1;border-top:1px solid var(--paper-ink);padding-top:4px;font-size:10.5px;color:var(--paper-muted);position:relative;min-height:46px}
.paper-sig svg{position:absolute;bottom:18px;left:6px;width:110px;height:38px;stroke:#1F3F8F;fill:none;stroke-width:2}
.stamp{position:absolute;right:28px;bottom:38px;width:74px;height:74px;border:2px solid rgba(31,63,143,.55);border-radius:50%;display:grid;place-items:center;color:rgba(31,63,143,.7);font-size:8.5px;font-weight:800;text-align:center;transform:rotate(-14deg);letter-spacing:.04em}
.paper-foot{margin-top:14px;padding-top:8px;border-top:1px dashed var(--paper-line);color:var(--paper-muted);font-size:10.5px;display:flex;justify-content:space-between;gap:8px}
.paper.sm{padding:14px;font-size:10.5px}
.paper.sm .paper-t b{font-size:12.5px}
.paper.sm .stamp{width:56px;height:56px;font-size:7px;right:14px;bottom:30px}
.paper-note{font-size:var(--fs-xs);color:var(--warning);background:var(--warning-bg);padding:6px 10px;border-radius:var(--r-sm);margin-bottom:var(--sp-2);display:flex;gap:6px;align-items:flex-start}
.paper-note .ic{width:14px;height:14px;margin-top:1px}

/* Popover */
.pop{position:absolute;top:calc(100% + 6px);right:0;z-index:70;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-3);width:360px;max-width:calc(100vw - 24px);animation:pop 160ms var(--ease);overflow:hidden}
.pop-h{display:flex;justify-content:space-between;align-items:center;padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--border);font-weight:700}
.pop-list{max-height:380px;overflow:auto}
.pop-i{display:flex;gap:10px;padding:12px var(--sp-4);border-bottom:1px solid var(--border);width:100%;text-align:left;transition:background var(--dur);font-size:var(--fs-sm)}
.pop-i:hover{background:var(--surface-2)}
.pop-i.unread{background:var(--brand-50)}
.pop-i .dotu{width:8px;height:8px;border-radius:50%;background:var(--brand-600);margin-top:6px;flex:none}
.pop-i .dotu.read{background:transparent}

/* Tour */
.tour-hole{position:fixed;z-index:300;border-radius:12px;box-shadow:0 0 0 3px var(--brand-500),0 0 0 9999px rgba(8,14,12,.5);pointer-events:none;transition:top 250ms var(--ease),left 250ms var(--ease),width 250ms var(--ease),height 250ms var(--ease)}
.tour-tip{position:fixed;z-index:301;width:min(360px,calc(100vw - 24px));background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-3);padding:var(--sp-5);border:1px solid var(--border)}
.tour-tip h3{font-size:var(--fs-lg);margin:4px 0 6px}
.tour-tip p{font-size:var(--fs-sm);color:var(--text-2)}
.tour-prog{height:4px;background:var(--surface-3);border-radius:2px;margin:var(--sp-3) 0;overflow:hidden}
.tour-prog i{display:block;height:100%;background:var(--brand-600);border-radius:2px;transition:width 250ms var(--ease)}

/* =========================================================
   4. MOBILE-SPECIFIC STYLES
   ========================================================= */
.mstage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:56px;padding:16px;overflow:hidden;background:radial-gradient(1200px 600px at 70% 40%,var(--stage-glow),transparent 70%),var(--bg);--ps:1}
.mdesc{max-width:380px;display:flex;flex-direction:column;gap:var(--sp-4)}
.mdesc h1{font-size:var(--fs-3xl);line-height:1.2;letter-spacing:-.01em}
.mdesc p{color:var(--text-2)}
.mdesc li{display:flex;gap:10px;align-items:flex-start;font-size:var(--fs-sm);color:var(--text-2);padding:6px 0}
.mdesc li .ic{color:var(--brand-600);margin-top:1px}
.phone-wrap{flex:none;width:calc(414px * var(--ps));height:calc(868px * var(--ps))}
.phone{width:414px;height:868px;transform:scale(var(--ps));transform-origin:top left;border-radius:62px;background:#0A0D0C;padding:12px;box-shadow:var(--sh-3),inset 0 0 0 2px #2B302E,inset 0 0 0 5px #121615}
.screen{position:relative;width:390px;height:844px;border-radius:50px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;isolation:isolate}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;border-radius:20px;background:#000;z-index:50}
.sbar{height:52px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;font-weight:600;font-size:15px;background:var(--surface);position:relative;z-index:2}
.sbar .si{display:flex;gap:6px;align-items:center}
.sbar svg{height:12px;fill:currentColor}
.home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--text);opacity:.8;z-index:45;pointer-events:none}
.mview{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.m-head{flex:none;display:flex;align-items:center;gap:var(--sp-2);padding:6px var(--sp-3) 10px var(--sp-4);background:var(--surface);border-bottom:1px solid var(--border);min-height:56px;z-index:2}
.m-head h1{font-size:var(--fs-xl);font-weight:700;letter-spacing:-.01em;line-height:1.2}
.m-head .sub{font-size:var(--fs-xs);color:var(--text-3)}
.m-head .icon-btn{width:44px;height:44px}
.mscroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:var(--sp-4);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.mscroll.has-cta{padding-bottom:110px}
.m-tabbar{flex:none;display:flex;background:var(--surface);border-top:1px solid var(--border);padding:6px 6px 26px;z-index:3}
.m-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:50px;font-size:11px;font-weight:600;color:var(--text-3);border-radius:var(--r-md);position:relative;transition:color var(--dur)}
.m-tab .ic{width:24px;height:24px}
.m-tab[aria-current="page"]{color:var(--brand-600)}
.m-tab .cnt{top:2px;right:calc(50% - 22px)}
.m-sec{margin:var(--sp-5) 0 var(--sp-2);display:flex;justify-content:space-between;align-items:center}
.m-sec h2{font-size:var(--fs-lg);font-weight:700}
.m-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--sp-4)}
.m-hero{background:var(--brand-600);color:var(--on-brand);border-radius:var(--r-xl);padding:var(--sp-5);display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;transition:transform var(--dur)}
.m-hero:active{transform:scale(.99)}
.m-hero .big{font-size:40px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.m-hero .op{opacity:.85;font-size:var(--fs-sm)}
.m-tiles{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2);margin-top:var(--sp-3)}
.m-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--sp-3) var(--sp-4);display:flex;flex-direction:column;gap:2px;text-align:left;min-height:76px;transition:border-color var(--dur)}
.m-tile:active{border-color:var(--brand-500)}
.m-tile .v{font-size:var(--fs-2xl);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.m-tile .l{font-size:var(--fs-xs);color:var(--text-2);display:flex;gap:4px;align-items:center}
.m-tile .l .ic{width:13px;height:13px}
.m-list{display:flex;flex-direction:column;gap:var(--sp-2)}
.m-item{display:flex;gap:var(--sp-3);align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--sp-3) var(--sp-3) var(--sp-3) var(--sp-4);width:100%;text-align:left;min-height:68px;transition:background var(--dur)}
.m-item:active{background:var(--surface-2)}
.m-item .chev{color:var(--text-3)}
.m-item .t{font-weight:700;font-size:var(--fs-md)}
.m-item .s{font-size:var(--fs-xs);color:var(--text-3)}
.m-item .amt{font-weight:700;font-variant-numeric:tabular-nums;font-size:var(--fs-sm);text-align:right}
.m-chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 var(--sp-3);scrollbar-width:none;margin:0 calc(var(--sp-4) * -1);padding-left:var(--sp-4);padding-right:var(--sp-4)}
.m-chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:var(--r-full);border:1px solid var(--border-strong);font-size:var(--fs-sm);font-weight:600;color:var(--text-2);background:var(--surface);display:inline-flex;align-items:center;gap:6px;transition:background var(--dur),color var(--dur)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip .n{font-size:11px;opacity:.75}
.m-cta{position:absolute;left:0;right:0;bottom:0;padding:var(--sp-3) var(--sp-4) var(--sp-4);background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:4}
.m-sheet-back{position:absolute;inset:0;background:var(--overlay);z-index:40;animation:fade 200ms}
.m-sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;background:var(--surface);border-radius:26px 26px 0 0;z-index:41;display:flex;flex-direction:column;animation:up 260ms var(--ease);padding-bottom:28px;box-shadow:var(--sh-3)}
.m-grab{width:40px;height:5px;border-radius:3px;background:var(--border-strong);margin:8px auto 4px;flex:none}
.m-sheet-h{display:flex;align-items:flex-start;gap:var(--sp-2);padding:var(--sp-2) var(--sp-3) var(--sp-3) var(--sp-5);flex:none}
.m-sheet-h h2{font-size:var(--fs-xl);line-height:1.25}
.m-sheet-b{overflow-y:auto;padding:0 var(--sp-5) var(--sp-3);flex:1;min-height:0}
.m-sheet-f{padding:var(--sp-3) var(--sp-5) 0;display:flex;gap:var(--sp-2);flex:none;border-top:1px solid var(--border)}
.m-row{display:flex;align-items:center;gap:var(--sp-3);min-height:52px;padding:6px 0;border-bottom:1px solid var(--border);width:100%;text-align:left}
.m-row:last-child{border-bottom:0}
.m-row .ic.lead{color:var(--text-2)}
.m-kv{display:flex;justify-content:space-between;gap:var(--sp-3);padding:8px 0;border-bottom:1px solid var(--border);font-size:var(--fs-sm)}
.m-kv:last-child{border-bottom:0}
.m-kv span:first-child{color:var(--text-3)}
.m-login{flex:1;display:flex;flex-direction:column;overflow-y:auto}
.m-login-hero{background:var(--brand-600);color:var(--on-brand);padding:40px var(--sp-6) 36px;display:flex;flex-direction:column;gap:10px}
.m-login-hero .logo{width:52px;height:52px;border-radius:16px;background:var(--on-brand);color:var(--brand-600)}
.m-login-hero .logo .ic{width:30px;height:30px}
.m-login-hero h1{font-size:30px;letter-spacing:-.02em}
.m-login-body{padding:var(--sp-6);display:flex;flex-direction:column;gap:var(--sp-3);flex:1}
.acc{display:flex;gap:var(--sp-3);align-items:center;padding:var(--sp-3) var(--sp-4);border:1.5px solid var(--border);border-radius:var(--r-lg);width:100%;text-align:left;min-height:64px;background:var(--surface);transition:border-color var(--dur),background var(--dur)}
.acc[aria-pressed="true"]{border-color:var(--brand-600);background:var(--brand-50)}
.m-success{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--sp-3);padding:var(--sp-8) var(--sp-2) var(--sp-4)}
.m-success .ring{width:96px;height:96px;border-radius:50%;background:var(--success-bg);color:var(--success);display:grid;place-items:center;animation:pop 400ms var(--ease)}
.m-success .ring .ic{width:52px;height:52px;stroke-width:2.4}
.m-success h2{font-size:var(--fs-2xl);line-height:1.25}
.m-mini-paper{max-height:none}
@media (max-width:1060px){.mdesc{display:none}}
@media (max-width:520px){
  .mstage{padding:0;background:var(--bg)}
  .phone-wrap{width:100%;height:100%}
  .phone{width:100%;height:100%;transform:none;border-radius:0;padding:0;box-shadow:none;background:none}
  .screen{width:100%;height:100%;border-radius:0}
  .island,.sbar,.home-ind{display:none}
  .m-tabbar{padding-bottom:max(8px,env(safe-area-inset-bottom))}
}

/* =========================================================
   5. WEB-SPECIFIC STYLES
   ========================================================= */
.app{position:fixed;top:var(--topbar-h);left:0;right:0;bottom:0}
.wapp{display:grid;grid-template-columns:240px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100%;transition:grid-template-columns var(--dur) var(--ease)}
.wapp.collapsed{grid-template-columns:72px minmax(0,1fr)}
.wside{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:var(--sp-3);gap:2px;overflow-y:auto;overflow-x:hidden}
.nav-i{display:flex;align-items:center;gap:var(--sp-3);min-height:42px;padding:0 var(--sp-3);border-radius:var(--r-md);color:var(--text-2);font-weight:600;font-size:var(--fs-md);width:100%;text-align:left;position:relative;transition:background var(--dur),color var(--dur)}
.nav-i:hover{background:var(--surface-2);color:var(--text);text-decoration:none}
.nav-i[aria-current="page"]{background:var(--brand-50);color:var(--brand-700)}
.nav-i .ic{width:20px;height:20px}
.nav-i .nb{margin-left:auto;font-size:11px;font-weight:700;background:var(--danger-bg);color:var(--danger);padding:1px 7px;border-radius:var(--r-full)}
.nav-sec{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);padding:var(--sp-4) var(--sp-3) var(--sp-1)}
.nav-soon{margin-left:auto;font-size:10px;font-weight:700;color:var(--text-3);border:1px solid var(--border);padding:0 6px;border-radius:var(--r-full)}
.wapp.collapsed .nav-l,.wapp.collapsed .nav-sec,.wapp.collapsed .nb,.wapp.collapsed .nav-soon,.wapp.collapsed .side-foot{display:none}
.wapp.collapsed .nav-i{justify-content:center;padding:0}
.side-foot{margin-top:auto;padding:var(--sp-3);border-radius:var(--r-md);background:var(--surface-2);font-size:var(--fs-xs);color:var(--text-2)}
.wmain{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}
.wtop{height:60px;flex:none;display:flex;align-items:center;gap:var(--sp-3);padding:0 var(--sp-6);border-bottom:1px solid var(--border);background:var(--surface);position:relative;z-index:20}
.wtop .search-f{max-width:440px}
.wtop .anchor{position:relative}
.hamb{display:none}
.user-btn{display:flex;align-items:center;gap:10px;padding:4px 8px 4px 4px;border-radius:var(--r-full);border:1px solid var(--border);min-height:40px;transition:background var(--dur)}
.user-btn:hover{background:var(--surface-2)}
.user-btn .nm{font-size:var(--fs-sm);font-weight:600;line-height:1.15;text-align:left}
.user-btn .rl{font-size:11px;color:var(--text-3);font-weight:500;display:block}
.wcontent{flex:1;min-height:0;overflow:auto;padding:var(--sp-6);container-type:inline-size}
.wcontent-in{max-width:1480px;margin:0 auto;display:flex;flex-direction:column;gap:var(--sp-5)}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--sp-4);flex-wrap:wrap}
.ph h1{font-size:var(--fs-3xl);line-height:1.2;letter-spacing:-.015em}
.ph p{color:var(--text-2);margin-top:4px}
.ph .acts{display:flex;gap:var(--sp-2);flex-wrap:wrap}
.crumb{font-size:var(--fs-sm);color:var(--text-3);display:flex;gap:6px;align-items:center}
.crumb .ic{width:14px;height:14px}
.intro{display:grid;grid-template-columns:1fr;gap:var(--sp-4);padding:var(--sp-6);background:linear-gradient(135deg,var(--brand-50),var(--surface) 70%);position:relative}
.intro h2{font-size:var(--fs-2xl);line-height:1.25;letter-spacing:-.01em;margin:6px 0 8px;max-width:760px}
.intro p{color:var(--text-2);max-width:760px}
.intro .close{position:absolute;top:10px;right:10px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flow li{display:flex;align-items:center;gap:6px;font-size:var(--fs-sm);font-weight:600;color:var(--text-2)}
.flow .n{width:22px;height:22px;border-radius:50%;background:var(--brand-600);color:var(--on-brand);display:grid;place-items:center;font-size:11px;font-weight:800}
.flow .sep{color:var(--text-3)}
.kpis{display:grid;grid-template-columns:1fr;gap:var(--sp-4)}
.kpi{text-align:left;padding:var(--sp-5);display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-1);transition:border-color var(--dur),box-shadow var(--dur),transform var(--dur)}
.kpi:hover{border-color:var(--border-strong);box-shadow:var(--sh-2)}
.kpi-l{font-size:var(--fs-sm);font-weight:600;color:var(--text-2);display:flex;gap:6px;align-items:center}
.kpi-l .ic{width:16px;height:16px}
.kpi-v{font-size:var(--fs-4xl);font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi-s{font-size:var(--fs-xs);color:var(--text-3)}
.kpi.k-danger .kpi-l .ic{color:var(--danger)} .kpi.k-warning .kpi-l .ic{color:var(--warning)} .kpi.k-brand .kpi-l .ic{color:var(--brand-600)} .kpi.k-neutral .kpi-l .ic{color:var(--text-2)}
.g2,.g3{display:grid;grid-template-columns:1fr;gap:var(--sp-4)}
.amt-row{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--border)}
.amt-row:last-of-type{border-bottom:0}
.amt-row .v{font-size:var(--fs-2xl);font-weight:800;font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-r{display:grid;grid-template-columns:130px 1fr 32px;gap:10px;align-items:center;font-size:var(--fs-sm)}
.bar-t{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden;display:flex}
.bar-t i{display:block;height:100%}
.bar-t .f{background:var(--danger)} .bar-t .u{background:var(--warning)}
.legend{display:flex;gap:var(--sp-4);flex-wrap:wrap;font-size:var(--fs-xs);color:var(--text-2);margin-top:var(--sp-3)}

.d-legend button{display:flex;align-items:center;gap:8px;font-size:var(--fs-sm);padding:5px 8px;border-radius:var(--r-sm);min-height:32px;transition:background var(--dur)}
.d-legend button:hover{background:var(--surface-2)}
.d-legend .c{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.filters{display:flex;gap:var(--sp-2);flex-wrap:wrap;padding:var(--sp-4);border-bottom:1px solid var(--border);align-items:center}
.filters .select{width:auto;min-width:150px}
.tbl-foot{padding:var(--sp-3) var(--sp-4);font-size:var(--fs-xs);color:var(--text-3);border-top:1px solid var(--border)}
.pd-head{display:flex;justify-content:space-between;gap:var(--sp-4);flex-wrap:wrap;align-items:flex-start}
.pd-title{display:flex;gap:var(--sp-3);align-items:center;flex-wrap:wrap}
.pd-title h1{font-size:var(--fs-3xl);letter-spacing:-.015em;line-height:1.15}
.pd-meta{display:flex;gap:var(--sp-2) var(--sp-4);flex-wrap:wrap;color:var(--text-2);font-size:var(--fs-sm);margin-top:6px}
.pd-meta b{color:var(--text)}
.pd-grid{display:grid;gap:var(--sp-4);grid-template-columns:minmax(0,1fr);grid-template-areas:"checks" "compare" "docs";align-items:start}
#docs{grid-area:docs} #compare{grid-area:compare} #checks{grid-area:checks}
.doc{border:1px solid var(--border);border-radius:var(--r-md);padding:var(--sp-3);background:var(--surface)}
.doc+.doc{margin-top:var(--sp-2)}
.doc.missing{border-style:dashed;border-width:1.5px;background:var(--surface-2)}
.doc.missing.req{border-color:color-mix(in srgb,var(--danger) 55%,transparent);background:var(--danger-bg)}
.doc-t{display:flex;gap:8px;align-items:flex-start}
.doc-t>.ic{width:20px;height:20px;color:var(--brand-600);margin-top:1px}
.doc .fn{font-weight:600;font-size:var(--fs-sm);word-break:break-all}
.doc .meta{font-size:var(--fs-xs);color:var(--text-3)}
.doc-acts{display:flex;gap:6px;margin-top:var(--sp-2);flex-wrap:wrap}
.oldv{font-size:var(--fs-xs);color:var(--text-2);display:flex;gap:6px;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px dashed var(--border)}
.cmp th:not(:first-child),.cmp td:not(:first-child){text-align:right}
.cmp td{padding:9px var(--sp-3);font-size:var(--fs-sm)}

.cmp .bad{background:var(--danger-bg);color:var(--danger);font-weight:700}
.cmp .unk{background:var(--warning-bg);color:var(--warning);font-weight:700}
.cmp .bad .ic,.cmp .unk .ic{width:14px;height:14px;margin-right:3px}

.mini{width:28px;height:28px;display:inline-grid;place-items:center;border-radius:6px;color:var(--text-3);transition:background var(--dur),color var(--dur)}

.mini .ic{width:14px;height:14px}

.timeline li:last-child{border-bottom:0}
.timeline .act{font-weight:600;font-size:var(--fs-sm)}

.ver-i:last-child{border-bottom:0}

.manifest li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.stages{display:flex;flex-direction:column;gap:8px;margin-top:var(--sp-3)}
.stages li{display:flex;gap:8px;align-items:center;font-size:var(--fs-sm);color:var(--text-3)}
.stages li.on{color:var(--text)} .stages li.done{color:var(--success)}

const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ic = (n, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;

const toQ = s => { const [a, b = ''] = String(s).trim().replace(',', '.').split('.'); return parseInt(a, 10) * 100 + parseInt((b + '00').slice(0, 2), 10); };
const sumL = ls => ls.reduce((t, l) => t + l.qty * l.price, 0);
const grp = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
function money(q, cur) { const neg = q < 0; q = Math.abs(q); return `${neg ? '−' : ''}${grp(Math.floor(q / 100))},${String(q % 100).padStart(2, '0')}${cur ? ' ' + cur : ''}`; }

const dayMs = s => Date.parse(s.slice(0, 10) + 'T00:00:00Z');

  else if (o.currency !== cur) add('R-004', 'UNKNOWN', `Faktura ${cur}, sifariş ${o.currency} ilə tərtib olunub. Valyuta avtomatik çevrilmir — qiymət müqayisəsi dayandırıldı.`, [E('invoice', 'total'), E('order', 'total')], { fix: 'invoice' });

function info(p) {

const sortIc = k => S.ui.sort.k === k ? ic(S.ui.sort.d > 0 ? 'sort-u' : 'sort-d') : ic('sort');
function filteredPkgs() {
  const f = S.ui.pf, q = f.q.trim().toLowerCase();
  let list = S.packages.filter(p => {
    const i = info(p), c = cust(p.customerId);
    if (q && ![p.inv, c.name, p.invoice.poRef || '', p.orderPo || '', p.delivery?.no || ''].some(x => x.toLowerCase().includes(q))) return false;
    if (f.status && i.status !== f.status) return false;
    if (f.customer && p.customerId !== f.customer) return false;
    if (f.owner && p.owner !== f.owner) return false;
    if (f.issue && !i.primary.some(x => x.id === f.issue)) return false;
    if (f.period && days(p.date, nowIso()) > +f.period) return false;
    return true;
  });
  const k = S.ui.sort.k, d = S.ui.sort.d;
  const val = p => ({ inv: p.inv, customer: cust(p.customerId).name, date: p.date, amount: p.currency + String(p.invoice.total).padStart(12, '0'), status: PST_ORDER.indexOf(info(p).status), blockers: info(p).primary.length, owner: uname(p.owner), updated: p.updatedAt })[k];
  return list.sort((a, b) => { const x = val(a), y = val(b); return (x > y ? 1 : x < y ? -1 : 0) * d; });
}

  if (!p) return emptyState('Paket tapılmadı', 'Bu paket silinib və ya mövcud deyil. Audit tarixçəsində qeyd saxlanılır.', `<a class="btn btn-secondary" href="#/web/packages">Paketlərə qayıt</a>`, 'package');
  const i = info(p), c = cust(p.customerId), r = rulesFor(p);
  const busy = S.ui.busy[p.id];
  let primary;
  if (i.status === 'READY_FOR_APPROVAL') primary = `<button class="btn btn-primary" data-act="approve" data-id="${p.id}" id="btnApprove">${ic('check')}Təsdiqlə</button>`;
  else if (i.status === 'APPROVED_READY') primary = `<button class="btn btn-primary" data-act="export" data-id="${p.id}" id="btnExport">${ic('download')}İxrac et</button>`;
  else if (i.status === 'EXPORTED') primary = `<button class="btn btn-secondary" data-act="export" data-id="${p.id}" id="btnExport">${ic('download')}Manifesti yenidən yüklə</button>`;
  else primary = `<button class="btn btn-primary" aria-disabled="true" data-act="approve" data-id="${p.id}" id="btnApprove" title="Bloklayan yoxlamalar var">${ic('lock')}Təsdiqlə</button>`;
  const neverApproved = !p.approvals.length && !p.exports.length;
  return `<div>
    <div class="crumb"><a href="#/web/packages">Faktura paketləri</a>${ic('chev-r')}<span>${p.inv}</span></div>
    <div class="pd-head" style="margin-top:8px">
      <div><div class="pd-title"><h1>${p.inv}</h1>${pBadge(i.status)}<span class="tag">Paket v${p.version}</span></div>
      <div class="pd-meta"><span>${ic('building')} <b>${c.name}</b></span><span>Məbləğ: <b class="num">${money(p.invoice.total, p.currency)}</b></span><span>Tarix: <b>${fD(p.date)}</b></span><span>Qayda dəsti: <b>v${r.v}</b></span><span class="row">Məsul: ${avatar(p.owner)} <b>${uname(p.owner)}</b></span></div></div>
      <div class="ph"><div class="acts">
        <button class="btn btn-secondary ${busy ? 'loading' : ''}" data-act="recheck" data-id="${p.id}" id="btnRecheck">${ic('refresh', busy ? 'spin' : '')}${busy ? 'Yoxlanılır…' : 'Yenidən yoxla'}</button>
        <button class="btn btn-secondary" data-act="upload" data-id="${p.id}">${ic('upload')}Sənəd yüklə</button>
        ${primary}
      </div></div>
    </div></div>
  ${readiness(p, i)}
  ${!p.linkConfirmed && !p.processing ? `<div class="banner warning" id="matchBanner">${ic('link')}<div class="grow"><h3>${p.candidates.length > 1 ? `${p.candidates.length} mümkün sifariş tapıldı — seçim tələb olunur` : `Sifariş uyğunlaşdırması təsdiq gözləyir: ${p.candidates[0]?.po} namizəddir`}</h3><p>${esc(p.candidates.map(x => x.po + ': ' + x.why).join(' · '))} Semantik oxşarlıq sübut deyil — əlaqəni insan təsdiqləyir.</p></div><div class="acts"><button class="btn btn-primary btn-sm" data-act="match" data-id="${p.id}">${ic('link')}Bax və təsdiqlə</button></div></div>` : ''}
  ${p.processing ? '' : `<div class="pd-grid">
    ${docsPanel(p, r)}
    ${comparePanel(p, i)}
    ${checksPanel(p, i, r)}
  </div>`}
  ${activityPanel(p, neverApproved)}`;
}
function docsPanel(p, r) {
  const card = t => {
    const D = docOf(p, t);
    if (!D || (t === 'delivery' && !p.delivery)) {
      const req = t === 'delivery' && r.requireDelivery;
      return `<div class="doc missing ${req ? 'req' : ''}"><div class="doc-t">${ic(TYPE_I[t])}<div class="grow"><div class="fn">${TYPE_L[t]} yoxdur</div><div class="meta">${req ? `Müştəri qaydası (v${r.v}) bu sənədi tələb edir. “Sənəd yoxdur” — “sənəd oxunmadı” deyil.` : 'Bu müştəri üçün tələb olunmur.'}</div></div></div>${req ? `<div class="doc-acts"><button class="btn btn-secondary btn-sm" data-act="upload" data-id="${p.id}" data-type="${t}">${ic('upload')}Yüklə</button></div>` : ''}</div>`;
    }
    const V = D.versions[D.versions.length - 1]; const st = DST[t === 'order' && !p.linkConfirmed ? 'REVIEW_REQUIRED' : V.status];
    const stLabel = t === 'order' && !p.linkConfirmed ? badge({ l: 'Uyğunlaşdırma gözləyir', c: 'warning', i: 'link' }) : badge(st);
    return `<div class="doc"><div class="doc-t">${ic(TYPE_I[t])}<div class="grow"><div class="row between"><span class="b sm">${TYPE_L[t]}</span><span class="tag">v${V.v}</span></div><div class="fn">${esc(V.file)}</div>
      <div class="row wrap" style="margin:4px 0">${stLabel}<span class="tag">${V.src}</span></div>
      <div class="meta">${ushort(V.by)} · ${fDT(V.at)} · hash ${V.hash.slice(0, 8)}</div></div></div>
      <div class="doc-acts"><button class="btn btn-ghost btn-sm" data-act="viewer" data-id="${p.id}" data-doc="${t}" data-hl="">${ic('eye')}Bax</button>${t !== 'order' ? `<button class="btn btn-ghost btn-sm" data-act="upload" data-id="${p.id}" data-type="${t}">${ic('upload')}Yeni versiya</button>` : ''}</div>
      ${D.versions.length > 1 ? `<details style="margin-top:6px"><summary>${ic('chev-r')}Əvvəlki versiyalar (${D.versions.length - 1}) — audit üçün saxlanılır</summary>${D.versions.slice(0, -1).reverse().map(v => `<div class="oldv"><span>v${v.v} · ${esc(v.file)}<br><span class="muted">${ushort(v.by)} · ${fDT(v.at)}</span></span><button class="mini" data-act="viewer" data-id="${p.id}" data-doc="${t}" data-hl="" data-ver="${v.v}" aria-label="v${v.v} versiyasına bax">${ic('eye')}</button></div>`).join('')}</details>` : ''}
    </div>`;
  };
  return `<section class="panel" id="docs" aria-labelledby="h-docs"><div class="panel-h"><h3 id="h-docs">Sənədlər və versiyalar</h3></div>${['invoice', 'order', 'delivery'].map(card).join('')}
  <p class="hint" style="margin-top:10px">${ic('info')} Çıxarış: əvvəlcədən hazırlanmış nəticə (mock adapter) — canlı AI analizi kimi təqdim olunmur.</p></section>`;
}
function comparePanel(p, i) {
  const inv = p.invoice, o = p.linkConfirmed && p.orderPo ? S.orders[p.orderPo] : null, d = p.delivery, cur = p.currency;
  const dlLinked = d && o && d.poRef === o.po;
  const can = !!o && o.currency === cur;
  const src = (doc, hl) => `<button class="mini" data-act="viewer" data-id="${p.id}" data-doc="${doc}" data-hl="${hl}" aria-label="Mənbəyə bax">${ic('eye')}</button>`;
  const edit = f => `<button class="mini" data-act="edit-field" data-id="${p.id}" data-f="${f}" aria-label="Çıxarışı düzəlt: ${FIELD_L(f)}">${ic('edit')}</button>`;
  const cell = (v, state, acts = '') => `<td class="num ${state || ''}">${state === 'bad' ? ic('fail') : state === 'unk' ? ic('unknown') : ''}${v}${acts ? `<span class="cell-act">${acts}</span>` : ''}</td>`;
  const unread = inv.unreadable.includes('poRef');
  const poState = unread ? 'unk' : (!inv.poRef ? 'bad' : (o && inv.poRef !== o.po ? 'bad' : ''));
  const rows = [];
  rows.push(`<tr><td>Sifariş № (PO)</td>${cell(unread ? 'oxunmadı' : (inv.poRef || 'yoxdur'), poState, src('invoice', 'po') + edit('poRef'))}${cell(o ? o.po : '—')}${cell(d ? d.poRef : 'sənəd yoxdur', d && o && d.poRef !== o.po ? 'unk' : '')}</tr>`);
  rows.push(`<tr><td>Alıcı</td>${cell(cust(p.customerId).name)}${cell(o ? cust(o.customerId).name : '—', o && o.customerId !== p.customerId ? 'bad' : '')}${cell(d ? cust(d.customerId).name : '—', d && d.customerId !== p.customerId ? 'bad' : '', d ? src('delivery', 'customer') : '')}</tr>`);
  rows.push(`<tr><td>Valyuta</td>${cell(cur)}${cell(o ? o.currency : '—', o && o.currency !== cur ? 'unk' : '')}${cell('—')}</tr>`);
  inv.lines.forEach(l => {
    const ol = o?.lines.find(x => x.code === l.code), dl = dlLinked ? d.lines.find(x => x.code === l.code) : null, P = PRODUCTS[l.code];
    rows.push(`<tr class="grp"><td colspan="4">${l.code} · ${P.d}</td></tr>`);
    rows.push(`<tr><td>Miqdar (${P.u})</td>${cell(qty(l.qty), can && ol && ol.qty !== l.qty ? 'bad' : (dl && dl.qty !== l.qty ? 'bad' : ''), src('invoice', 'line:' + l.code) + edit('qty:' + l.code))}${cell(ol ? qty(ol.qty) : '—')}${cell(dl ? qty(dl.qty) : '—', dl && dl.qty !== l.qty ? 'bad' : '', dl ? src('delivery', 'line:' + l.code) : '')}</tr>`);
    rows.push(`<tr><td>Vahid qiymət</td>${cell(money(l.price), can && ol && ol.price !== l.price ? 'bad' : '', src('invoice', 'line:' + l.code) + edit('price:' + l.code))}${cell(ol ? money(ol.price) + (o.currency !== cur ? ' ' + o.currency : '') : '—', o && o.currency !== cur ? 'unk' : '')}${cell('—')}</tr>`);
  });
  rows.push(`<tr class="grp"><td colspan="4">Cəmlər</td></tr>`);
  rows.push(`<tr><td>Yekun məbləğ</td>${cell('<b>' + money(inv.total, cur) + '</b>', '', src('invoice', 'total'))}${cell(o ? money(sumL(o.lines), o.currency) : '—', o && o.currency !== cur ? 'unk' : '')}${cell('—')}</tr>`);
  return `<section class="panel" id="compare" aria-labelledby="h-cmp"><div class="panel-h"><h3 id="h-cmp">Müqayisə: faktura · sifariş · təhvil</h3><span class="tag">${ic('sparkle')}AI çıxarışı · mənbəli</span></div>
  <div class="table-wrap"><table class="table cmp"><thead><tr><th>Sahə</th><th>Faktura</th><th>Sifariş${o ? '' : ' (təsdiqlənməyib)'}</th><th>Təhvil</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>
  <div class="banner neutral" style="margin-top:12px;padding:12px">${ic('info')}<div class="grow"><p style="margin:0"><b>İki fərqli düzəliş yolu:</b> çıxarış səhvdirsə ${ic('edit')} ilə sahəni mənbəyə baxaraq düzəldin (sənəd dəyişmir, səbəb auditə yazılır). Fakturanın özündə səhv varsa, onu mənbə sistemində düzəldib <b>yeni versiya</b> yükləyin.</p></div></div></section>`;
}
function checkCard(p, c, compact) {
  const R = RULES[c.id], t = openTaskFor(p.id, c.id);
  if (compact) return `<div class="chk compact ${c.outcome}" data-rule="${c.id}">${ic(OUT[c.outcome].i, 'out-ic ' + c.outcome)}<span class="grow"><span class="chk-id">${c.id}</span> ${R.t}<span class="sr-only"> — ${OUT[c.outcome].l}</span><span class="cell-sub" style="display:block">${esc(c.msg)}</span></span>${c.ev[0] ? `<button class="mini" data-act="viewer" data-id="${p.id}" data-doc="${c.ev[0].doc}" data-hl="${c.ev[0].hl}" aria-label="Mənbəyə bax">${ic('eye')}</button>` : ''}</div>`;
  const acts = [];
  if (c.fix === 'link') acts.push(`<button class="btn btn-primary btn-sm" data-act="match" data-id="${p.id}">${ic('link')}Sifarişi seç</button>`);
  if (c.fix === 'edit-po') acts.push(`<button class="btn btn-primary btn-sm" data-act="edit-field" data-id="${p.id}" data-f="poRef">${ic('edit')}Mənbəyə bax, sahəni düzəlt</button>`);
  if (c.fix === 'sig') acts.push(`<button class="btn btn-primary btn-sm" data-act="viewer" data-id="${p.id}" data-doc="delivery" data-hl="signature" data-sig="1">${ic('sign')}İmzaya bax və təsdiqlə</button>`);
  if (c.fix === 'upload-dl') acts.push(`<button class="btn btn-secondary btn-sm" data-act="upload" data-id="${p.id}" data-type="delivery">${ic('upload')}Təhvil sənədi yüklə</button>`);
  if (c.fix === 'invoice') acts.push(`<button class="btn btn-secondary btn-sm" data-act="upload" data-id="${p.id}" data-type="invoice">${ic('upload')}Yeni faktura versiyası</button>`);
  if (t) acts.push(`<a class="badge b-outline" href="#/web/tasks" title="${esc(t.step)}">${ic('tasks')}${t.id} · ${ushort(t.who)} · ${TST[t.status].l}</a>`);
  else acts.push(`<button class="btn btn-ghost btn-sm" data-act="task-new" data-id="${p.id}" data-rule="${c.id}">${ic('plus')}Tapşırıq yarat</button>`);
  return `<article class="chk ${c.outcome}" data-rule="${c.id}"><div class="chk-top">${oBadge(c.outcome)}<span class="chk-id">${c.id}</span>${R.core ? '<span class="tag">Əsas yoxlama</span>' : ''}</div>
    <h4>${R.t}</h4><p>${esc(c.msg)}</p>
    ${c.ev.length ? `<div class="evs">${c.ev.map(e => `<button class="ev-link" data-act="viewer" data-id="${p.id}" data-doc="${e.doc}" data-hl="${e.hl}">${ic('file')}<span><b>${esc(e.ref)}</b><q>${esc(e.quote)}</q></span></button>`).join('')}</div>` : ''}
    <div class="chk-acts">${acts.join('')}</div></article>`;
}
function checksPanel(p, i, r) {
  const prim = i.checks.filter(c => (c.outcome === 'FAIL' || c.outcome === 'UNKNOWN') && !c.cascade);
  const casc = i.checks.filter(c => c.cascade);
  const rest = i.checks.filter(c => c.outcome === 'PASS' || c.outcome === 'NOT_APPLICABLE');
  return `<section class="panel" id="checks" aria-labelledby="h-chk"><div class="panel-h"><h3 id="h-chk">Yoxlamalar</h3><span class="muted xs">qayda dəsti v${r.v} · ${i.checks.length} qayda</span></div>
  <div class="sumbar">${['PASS', 'FAIL', 'UNKNOWN', 'NOT_APPLICABLE'].map(o => `<span class="badge b-${OUT[o].c}">${ic(OUT[o].i)}${i.counts[o]} ${OUT[o].l.toLowerCase()}</span>`).join('')}</div>
  ${prim.length ? `<div class="grp-t">Bloklayan problemlər</div>${prim.map(c => checkCard(p, c)).join('')}` : `<div class="banner success" style="padding:12px">${ic('pass')}<div><h3>Bloklayan problem yoxdur</h3><p>Problem uydurulmur: bütün məcburi qaydalar cari versiyada keçib.</p></div></div>`}
  ${casc.length ? `<div class="grp-t">Asılı yoxlamalar (${casc.length})</div><p class="hint" style="margin-bottom:6px">Yuxarıdakı problem həll edilənə qədər aparılmır və paketi bloklayır.</p>${casc.map(c => checkCard(p, c, 1)).join('')}` : ''}
  <details style="margin-top:12px" ${prim.length ? '' : 'open'}><summary>${ic('chev-r')}Keçən və tətbiq olunmayan yoxlamalar (${rest.length})</summary><div style="margin-top:6px">${rest.map(c => checkCard(p, c, 1)).join('')}</div></details>
  </section>`;
}
function activityPanel(p, canDel) {
  const ev = S.audit.filter(e => e.pkg === p.id).sort((a, b) => b.at.localeCompare(a.at) || b.id.localeCompare(a.id, undefined, { numeric: true }));
  const list = S.ui.actAll ? ev : ev.slice(0, 8);
  return `<section class="panel" id="activity" aria-labelledby="h-act"><div class="panel-h"><h3 id="h-act">Fəaliyyət tarixçəsi</h3><div class="row"><button class="btn btn-ghost btn-sm" data-act="report" data-id="${p.id}">${ic('download')}Daxili yoxlama hesabatı</button>${canDel ? `<button class="btn btn-ghost btn-sm" data-act="del-pkg" data-id="${p.id}">${ic('trash')}Paketi sil</button>` : ''}</div></div>
  <ol class="timeline">${list.map(e => `<li>${avatar(e.actor)}<div><div class="row wrap"><span class="act">${esc(e.action)}</span>${e.v ? `<span class="tag">v${e.v}</span>` : ''}<span class="when">${uname(e.actor)} · ${fDT(e.at)}</span></div><div class="det">${esc(e.detail)}</div></div></li>`).join('')}</ol>
  ${ev.length > 8 ? `<button class="link-btn" data-act="act-all">${S.ui.actAll ? 'Daha az göstər' : `Bütün ${ev.length} hadisəni göstər`}</button>` : ''}</section>`;
}

/* ---------- WEB: Tasks ---------- */
function taskRows() {
  const f = S.ui.tf;
  const list = S.tasks.filter(t => (f.status === 'active' ? t.status !== 'RESOLVED' : !f.status || t.status === f.status) && (!f.who || t.who === f.who))
    .sort((a, b) => (a.status === 'RESOLVED') - (b.status === 'RESOLVED') || a.due.localeCompare(b.due));
  if (!list.length) return emptyState('Bu filtrdə tapşırıq yoxdur', 'Tapşırıq paketin yoxlama nəticəsindən yaradılır: problemin yanındakı “Tapşırıq yarat” düyməsinə basın.', '', 'tasks');
  return `<div class="table-wrap"><table class="table"><thead><tr><th>Tapşırıq</th><th>Problem</th><th>Məsul</th><th>Tələb olunan addım</th><th>Son tarix</th><th>Status</th><th><span class="sr-only">Əməliyyatlar</span></th></tr></thead><tbody>
  ${list.map(t => { const p = pk(t.pkg); const over = t.status !== 'RESOLVED' && t.due < nowIso().slice(0, 10); const today = t.due === nowIso().slice(0, 10);
    return `<tr><td><b>${t.id}</b><div class="cell-sub">${fDT(t.at)}</div></td><td><a href="#/web/package/${t.pkg}" class="cell-main">${p?.inv || '—'}</a><div class="cell-sub"><span class="chk-id">${t.rule}</span> ${RULES[t.rule].s}</div></td>
    <td><span class="row">${avatar(t.who)}<span class="sm">${uname(t.who)}<span class="cell-sub" style="display:block">${USERS[t.who].title}</span></span></span></td>
    <td class="sm" style="max-width:340px">${esc(t.step)}${t.comment ? `<div class="cell-sub">Şərh: ${esc(t.comment)}</div>` : ''}</td>
    <td class="num sm">${fD(t.due)}${over ? `<div>${badge({ l: 'Gecikir', c: 'danger', i: 'alert' })}</div>` : today ? `<div>${badge({ l: 'Bu gün', c: 'warning', i: 'clock' })}</div>` : ''}</td><td>${tBadge(t.status)}</td>
    <td><div class="row" style="justify-content:flex-end">${t.status === 'OPEN' ? `<button class="btn btn-secondary btn-sm" data-act="task-next" data-t="${t.id}">İcraya götür</button>` : t.status === 'IN_PROGRESS' ? `<button class="btn btn-secondary btn-sm" data-act="task-next" data-t="${t.id}">Yoxlamaya göndər</button>` : t.status === 'SUBMITTED_FOR_RECHECK' ? '<span class="cell-sub">Yoxlama gözlənilir</span>' : `<span class="cell-sub">${fDT(t.resolvedAt)}</span>`}
    ${t.status !== 'RESOLVED' ? `<button class="mini" data-act="task-cancel" data-t="${t.id}" aria-label="${t.id} tapşırığını ləğv et">${ic('trash')}</button>` : ''}</div></td></tr>`; }).join('')}</tbody></table></div>`;
}
function pgTasks() {

  <div id="task-table">${taskRows()}</div></section>`;
}

let modalPrevFocus = null, modalOk = null;

function toast(msg, type = 'success') {

  el.className = 'toast ' + type; el.setAttribute('role', type === 'error' ? 'alert' : 'status');
  el.innerHTML = `${ic({ success: 'pass', error: 'fail', warn: 'alert', info: 'info' }[type])}<div class="grow">${esc(msg)}</div><button class="icon-btn" data-act="toast-x" aria-label="Bildirişi bağla">${ic('x')}</button>`;
  box.appendChild(el); while (box.children.length > 4) box.firstChild.remove();
  setTimeout(() => el.remove(), 4600);

    if (f === 'poRef' && !/^PO-\d{3,6}$/.test(val)) err = 'Format: PO-123 (böyük hərflə).';
    if (f.startsWith('qty:') && !/^[1-9]\d{0,6}$/.test(val)) err = 'Müsbət tam ədəd yazın.';
    if (f.startsWith('price:') && !/^\d{1,7}([.,]\d{1,2})?$/.test(val)) err = 'Məbləğ formatı: 100,00';
    if (!err && f === 'poRef' && val === p.invoice.poRef) err = 'Yeni dəyər cari dəyərdən fərqli olmalıdır.';
    setErr('ed-val', err); setErr('ed-why', why.length < 5 ? 'Səbəb yazın (ən azı 5 simvol).' : '');
    if (err || why.length < 5) return;
    dEditField(p, f, val, why, me().id); closeModal(); commit(); toast(`Çıxarış düzəldildi, paket v${p.version}: ${PST[info(p).status].l}.`, 'success');

  'task-ok': d => {

    setErr('tk-due', !due ? 'Son tarixi seçin.' : due < nowIso().slice(0, 10) ? 'Son tarix keçmişdə ola bilməz.' : '');
    if (!who || step.length < 10 || !due || due < nowIso().slice(0, 10)) return;
    const t = dCreateTask(p, d.rule, who, step, due, cmt, me().id); closeModal(); commit(); toast(`${t.id} yaradıldı: ${uname(who)}, son tarix ${fD(due)}.`, 'success');
  },
  'sig-ok': d => { const p = pk(d.id); if (!can('edit')) return; dReviewSig(p, me().id); closeModal(); commit(); toast(`İmzanın mövcudluğu qeyd edildi. Paket: ${PST[info(p).status].l}.`, 'success'); },
  'appr-ok': d => { const p = pk(d.id); const ck = $('#ap-ck').checked; $('#f-ack').classList.toggle('has-err', !ck); if (!ck) return; const r = dApprove(p, me().id); closeModal(); commit(); toast(r.ok ? `${money(p.invoice.total, p.currency)}-lik faktura paketi göndərilməyə hazırdır.` : r.msg, r.ok ? 'success' : r.dup ? 'info' : 'error'); },
  'exp-ok': d => { const p = pk(d.id); const files = $$('.ex-f').filter(x => x.checked).map(x => x.value); const r = dExport(p, me().id, files); closeModal(); commit(); if (!r.ok) return toast(r.msg, 'error'); download(`PayProof_${p.inv}_v${p.version}_manifest.json`, manifest(p, r.exp)); toast(r.dup ? 'Bu versiya artıq ixrac edilib — yeni hadisə yaradılmadı.' : `${p.inv} v${p.version} ixrac edildi. Manifest yükləndi.`, r.dup ? 'info' : 'success'); },
  'newpkg-ok': () => {
    const id = $('input[name="nset"]:checked')?.value; $('#f-set').classList.toggle('has-err', !id); if (!id) return;
    const set = NEWSETS.find(x => x.id === id);
    if (S.packages.some(p => p.inv === set.inv && p.customerId === set.c)) return toast(`${set.inv} artıq mövcuddur — təkrar paket yaradılmadı.`, 'warn');
    const p = dCreatePkg(set, $('#np-owner').value, me().id); closeModal(); go(`#/web/package/${p.id}`); toast(`${p.inv} yaradıldı, sənədlər emal olunur…`, 'info');
    setTimeout(() => { if (!pk(p.id)) return; dFinishProcessing(p); commit(); toast(`${p.inv} emal olundu: ${PST[info(p).status].l}.`, 'success'); }, 1400);
  },
  // mobile
  'm-pick': d => { S.ui.mPick = d.u; render(); },
  'm-login': () => { S.mobileUser = S.ui.mPick; const to = S.ui.mAfter && !S.ui.mAfter.includes('login') ? S.ui.mAfter : '#/mobile/home'; S.ui.mAfter = null; go(to); toast(`${USERS[S.mobileUser].name} kimi daxil oldunuz.`, 'success'); },
  'm-logout': () => { S.mobileUser = null; S.ui.sheet = null; go('#/mobile/login'); },
  'm-theme': () => toast('Görünüş cihazın sistem parametrinə (açıq / tünd) uyğunlaşır.', 'info'),
  'm-chip': d => { S.ui.mf.chip = d.v; if (route().page !== 'packages') go('#/mobile/packages'); else render(); },
  'm-refresh': () => { if (S.ui.mLoading) return; S.ui.mLoading = true; render(); setTimeout(() => { S.ui.mLoading = false; render(); toast('Siyahı yeniləndi.', 'info'); }, 650); },
  'sheet-check': d => { S.ui.sheet = { t: 'check', pid: d.id, rule: d.rule }; render(); },
  'sheet-doc': d => { const back = d.back === 'approve' ? { t: 'approve', pid: d.id } : d.back === 'check' ? { t: 'check', pid: d.id, rule: d.rule } : null; S.ui.sheet = { t: 'doc', pid: d.id, doc: d.doc, hl: d.hl || '', back }; render(); },
  'sheet-back': () => { S.ui.sheet = S.ui.sheet?.back || null; render(); },
  'sheet-close': () => { S.ui.sheet = null; render(); },
  'm-approve': d => { S.ui.apprCk = false; S.ui.sheet = { t: 'approve', pid: d.id }; render(); },
  'm-approve-ok': d => {
    const p = pk(d.id);
    if (!allSeen(p)) return toast('Təsdiqdən əvvəl paketdəki hər sənədə baxın.', 'warn');
    if (!S.ui.apprCk) return toast('Təsdiq qeydini işarələyin.', 'warn');
    const r = dApprove(p, S.mobileUser); S.ui.sheet = null;
    if (!r.ok) { render(); return toast(r.msg, r.dup ? 'info' : 'error'); }
    go(`#/mobile/success/${p.id}`); toast('Paket təsdiqləndi.', 'success');
  },
};
document.addEventListener('click', e => {
  const tx = e.target.closest('[data-act="toast-x"]'); if (tx) { tx.closest('.toast')?.remove(); return; }
  if (S.ui.pop && !e.target.closest('.pop') && !e.target.closest('[data-act="pop"]')) { S.ui.pop = null; render(); }
  if (e.target.closest('a[href^="#"]') && !e.target.closest('a[href^="#"]').dataset.act) return;
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  // backdrop handlers only act on direct hits, so they must not cancel clicks on inputs inside the modal/sheet
  if (el.tagName !== 'INPUT' && !el.dataset.act.endsWith('-bg')) e.preventDefault();
  if (el.getAttribute('aria-disabled') === 'true' && el.id === 'apprBtn') return ACT['m-approve-ok'](el.dataset, el, e);
  fn(el.dataset, el, e);
});
document.addEventListener('input', e => {
  const el = e.target.closest('[data-input]'); if (!el) return;
  const g = el.dataset.input, k = el.dataset.k;
  if (g === 'pf') { S.ui.pf[k] = el.value; $('#pkg-table').innerHTML = pkgTable(); }
  else if (g === 'tf') { S.ui.tf[k] = el.value; $('#task-table').innerHTML = taskRows(); }
  else if (g === 'af') { S.ui.af[k] = el.value; $('#audit-table').innerHTML = auditRows(); }
  else if (g === 'mf') { S.ui.mf[k] = el.value; $('#m-list').innerHTML = mListHTML(); }
  else if (g === 'up') { $('#m-body').innerHTML = upBody(pk(el.dataset.id), el.value); $('#up-type')?.focus(); }
  else if (g === 'appr') { S.ui.apprCk = el.checked; const b = $('#apprBtn'); if (b) el.checked ? b.removeAttribute('aria-disabled') : b.setAttribute('aria-disabled', 'true'); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if ($('#modal-root').innerHTML) return closeModal();
    if (S.ui.sheet) { S.ui.sheet = null; return render(); }
    if (S.ui.pop || S.ui.navOpen) { S.ui.pop = null; S.ui.navOpen = false; return render(); }
    if (T) return tourEnd();
  }
  if (e.key === 'Enter' && e.target.id === 'gsearch') { S.ui.pf = { q: e.target.value, status: '', customer: '', owner: '', issue: '', period: '' }; go('#/web/packages'); setTimeout(() => { const i = $('#pf-q'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 30); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr.clickable')) { e.preventDefault(); go(`#/web/package/${e.target.dataset.id}`); }
});
window.addEventListener('hashchange', () => { closeModal(); S.ui.sheet = null; S.ui.pop = null; S.ui.navOpen = false; render(); });
window.addEventListener('resize', () => { fitPhone(); positionTour(); });

/* ---------- Guided demo (walks the core flow; every step is idempotent) ---------- */
let T = null;
const P42 = () => pk('pkg_1042');
const TOUR = [
  { r: '#/web/overview', sel: '.intro', h: 'PayProof nədir?', t: 'B2B satış edən şirkətin maliyyə komandası fakturanı müştəriyə göndərməzdən əvvəl sifariş və təhvil sənədi ilə tutuşdurur. Hər nəticə mənbə ilə göstərilir, qərarı insan verir.', pre: () => { S.ui.intro = true; } },
  { r: '#/web/overview', sel: '#kpis', h: 'Bir baxışda vəziyyət', t: 'Paketlər statusa görə sayılır. Problemli məbləğ AZN və USD üzrə ayrıca göstərilir və itki kimi təqdim olunmur. Kartlara basanda siyahı filtrlənir.' },
  { r: '#/web/packages', sel: 'tr[data-row="pkg_1042"]', h: 'Problemli faktura: INV-1042', t: '12.000 AZN, B Mağazalar Şəbəkəsi. Müştəri fakturada PO və imzalı təhvil aktı tələb edir — fakturada isə PO yoxdur.' },
  { r: '#/web/package/pkg_1042', sel: '#matchBanner', h: 'AI sifarişi təklif edir, insan təsdiqləyir', t: 'Alıcı və məhsul kodlarına görə PO-381 namizəddir. Semantik oxşarlıq sübut deyil — “Növbəti” əlaqəni Aygün Məmmədova adından təsdiqləyir.', do: () => dConfirmLink(P42(), 'PO-381', 'u1') },
  { r: '#/web/package/pkg_1042', sel: '#checks', h: 'Qayda mühərriki: 2 bloklayan problem', t: 'R-001: fakturada məcburi PO yoxdur. R-007: imzalı təhvil sənədi yoxdur. Hər nəticənin altında mənbə sitatı var — basanda sənəd səhifəsi vurğulanmış açılır. “Növbəti” iki tapşırıq yaradır.', do: () => { const p = P42(); if (!openTaskFor(p.id, 'R-001')) dCreateTask(p, 'R-001', 'u6', STEP_T['R-001'](p), addDays(nowIso(), 1), '', 'u1'); if (!openTaskFor(p.id, 'R-007')) dCreateTask(p, 'R-007', 'u3', STEP_T['R-007'](p), addDays(nowIso(), 1), '', 'u1'); } },
  { r: '#/web/package/pkg_1042', sel: '#checks [data-rule="R-007"]', h: 'Düzəliş məsul şəxsə gedir', t: 'Mühasibat (Leyla) fakturanı mənbə sistemində düzəldir, anbar (Elvin) imzalı aktı yükləyir. “Növbəti” hər iki sənədi yükləyir.', do: () => { const p = P42(); dUpload(p, SAMPLES[0], 'u6'); dUpload(p, SAMPLES[1], 'u3'); } },
  { r: '#/web/package/pkg_1042', sel: '#docs', h: 'Yeni versiyalar — köhnəsi auditdə', t: 'Faktura v2 (PO-381 ilə) və TS-5531 imzalı akt əlavə olundu, paket versiyası artdı. İmza tələbi qalıb: əməkdaş sənədə baxıb imzanın mövcudluğunu qeyd edir (hüquqi autentifikasiya deyil).', do: () => dReviewSig(P42(), 'u1') },
  { r: '#/web/package/pkg_1042', sel: '#readiness', h: 'Bütün yoxlamalar keçdi', t: 'Cari versiya üzrə 9 qaydanın hamısı keçdi və ya tətbiq olunmur. R-001 və R-007 tapşırıqlarını sistem avtomatik bağladı — “düzəltdim” demək kifayət deyil. Paket təsdiqçini gözləyir.' },
  { r: '#/mobile/package/pkg_1042', sel: '.m-approve', h: 'Rəhbər mobil tətbiqdə təsdiqləyir', t: 'Rəşad Əliyev sənədlərə baxmadan təsdiq edə bilməz: hər sənədi açmalı və təsdiq qeydini işarələməlidir. “Növbəti” bunu onun adından edir.', pre: () => { S.mobileUser = 'u2'; }, do: () => { const p = P42(); docTypes(p).forEach(t => ((S.ui.seen[seenKey(p)] ||= {})[t] = 1)); dApprove(p, 'u2'); } },
  { r: '#/mobile/success/pkg_1042', sel: '.m-success', h: 'Nəticə', t: '“12.000,00 AZN-lik faktura paketi göndərilməyə hazırdır.” Bu, ödəniş zəmanəti deyil — yalnız sənəd hazırlığıdır.' },
  { r: '#/web/package/pkg_1042', sel: '#btnExport', h: 'İxrac', t: 'Manifestə yalnız seçilmiş sənədlər düşür; daxili AI izahları və audit qeydləri xarici paketə əlavə olunmur. Göndərmə PayProof-dan kənardadır.', do: () => { const p = P42(); dExport(p, 'u1', docTypes(p).map(t => curVer(p, t).file)); } },
  { r: '#/web/package/pkg_1042', sel: '#activity', h: 'Audit tarixçəsi', t: 'Hər addım — kim, nə vaxt, hansı versiyada — qeyd olunub. Təkrar təsdiq və ya ixrac sorğusu yeni hadisə yaratmır.' },
  { r: '#/web/package/pkg_1047', sel: '#readiness', h: 'Dürüst nəticə', t: 'Skanda oxunmayan PO “keçdi” sayılmır: paket bloklanır və insan yoxlamasına gedir. Düzgün paketdə (INV-1038) isə problem uydurulmur. Demo bitdi — istənilən ekranı sərbəst sınayın.' },
];
function tourStart() { closeModal(); reset(); S.ui.loaded = { overview: 1, packages: 1 }; T = { i: 0 }; toast('Demo məlumatları sıfırlandı. Bələdçi başladı.', 'info'); tourShow(); }
function tourShow() { const st = TOUR[T.i]; st.pre && st.pre(); T.scrolled = false; if (location.hash !== st.r) location.hash = st.r; else render(); }
function tourNext() { if (!T) return; const st = TOUR[T.i]; try { st.do && st.do(); } catch (err) { console.warn('tour step', err); } if (T.i >= TOUR.length - 1) { tourEnd(true); render(); return; } T.i++; tourShow(); }
function tourEnd(done) { T = null; $('#tour-root').innerHTML = ''; if (done) toast('Demo tamamlandı. İstənilən ekranı sərbəst sınaya bilərsiniz.', 'success'); }
function positionTour(tries = 0) {
  if (!T) return; const st = TOUR[T.i], el = $(st.sel);
  if (!el && tries < 15) return setTimeout(() => positionTour(tries + 1), 100);
  if (el && !T.scrolled) { el.scrollIntoView({ block: 'center', inline: 'nearest' }); T.scrolled = true; }
  const vw = innerWidth, vh = innerHeight, pad = 6;
  const r = el ? el.getBoundingClientRect() : null;
  const hole = r ? `<div class="tour-hole" style="top:${r.top - pad}px;left:${r.left - pad}px;width:${r.width + pad * 2}px;height:${r.height + pad * 2}px"></div>` : '';
  $('#tour-root').innerHTML = `${hole}<div class="tour-tip" role="dialog" aria-live="polite" aria-labelledby="tt-h"><span class="eyebrow">Addım ${T.i + 1} / ${TOUR.length}</span><h3 id="tt-h">${st.h}</h3><p>${st.t}</p><div class="tour-prog"><i style="width:${(T.i + 1) / TOUR.length * 100}%"></i></div><div class="row between"><button class="btn btn-ghost btn-sm" data-act="tour-skip">Bələdçini bağla</button><button class="btn btn-primary btn-sm" data-act="tour-next" id="tourNext">${T.i === TOUR.length - 1 ? 'Bitir' : 'Növbəti'} ${ic('arrow-r')}</button></div></div>`;
  const tip = $('.tour-tip'), tw = tip.offsetWidth, th = tip.offsetHeight;
  let top, left;
  if (!r) { top = (vh - th) / 2; left = (vw - tw) / 2; }
  else if (r.bottom + th + 18 < vh) { top = r.bottom + 14; left = r.left; }
  else if (r.top - th - 18 > 56) { top = r.top - th - 14; left = r.left; }
  else if (r.right + tw + 24 < vw) { top = r.top; left = r.right + 16; }
  else if (r.left - tw - 24 > 0) { top = r.top; left = r.left - tw - 16; }
  else { top = vh - th - 16; left = (vw - tw) / 2; }
  tip.style.top = Math.max(64, Math.min(top, vh - th - 12)) + 'px'; tip.style.left = Math.max(12, Math.min(left, vw - tw - 12)) + 'px';
  $('#tourNext')?.focus({ preventScroll: true });
}

/* ---------- self-check (runs once on load against a fresh seed; logs only on failure) ---------- */
function selfTest() {
  reset();
  const A = (c, m) => console.assert(c, 'PayProof self-check failed: ' + m);
  const st = id => { memo.clear(); return info(pk(id)).status; };
  A(money(1200000, 'AZN') === '12.000,00 AZN', 'money format'); A(toQ('9,10') === 910 && toQ('100') === 10000 && money(-50000) === '−500,00', 'toQ / negative');
  const exp = { pkg_1042: 'NEEDS_REVIEW', pkg_1038: 'READY_FOR_APPROVAL', pkg_1036: 'READY_FOR_APPROVAL', pkg_1043: 'NEEDS_FIX', pkg_1044: 'NEEDS_FIX', pkg_1045: 'NEEDS_FIX', pkg_1046: 'NEEDS_FIX', pkg_1047: 'NEEDS_REVIEW', pkg_1048: 'NEEDS_REVIEW', pkg_1049: 'NEEDS_REVIEW', pkg_1050: 'PROCESSING', pkg_1035: 'APPROVED_READY', pkg_1033: 'EXPORTED', pkg_1031: 'EXPORTED' };
  Object.entries(exp).forEach(([id, s]) => A(st(id) === s, `${id}: expected ${s}, got ${st(id)}`));
  A(info(pk('pkg_1044')).checks.find(c => c.id === 'R-005').diff === 50000, 'R-005 diff = 500,00');
  const p = P42(); A(dApprove(p, 'u2').ok === false, 'blocked package cannot be approved');
  dConfirmLink(p, 'PO-381', 'u1'); A(st(p.id) === 'NEEDS_FIX', '1042 after link → NEEDS_FIX');
  A(info(p).primary.map(c => c.id).join() === 'R-001,R-007', '1042 blockers = R-001, R-007');
  dUpload(p, SAMPLES[0], 'u6'); A(dUpload(p, SAMPLES[2], 'u1').dup, 'duplicate file detected');
  dUpload(p, SAMPLES[1], 'u3'); A(st(p.id) === 'NEEDS_REVIEW', 'signature pending → NEEDS_REVIEW');
  dReviewSig(p, 'u1'); A(st(p.id) === 'READY_FOR_APPROVAL', '1042 ready');
  A(dApprove(p, 'u1').ok === false, 'operator cannot approve'); A(dApprove(p, 'u2').ok, 'approver approves'); A(dApprove(p, 'u2').dup, 'approve idempotent');
  A(dExport(p, 'u1', ['a']).ok && dExport(p, 'u1', ['a']).dup && p.exports.length === 1, 'export idempotent');
  const q = pk('pkg_1035'); dUpload(q, { type: 'delivery', file: 'TS-5515_v2.pdf', dl: { no: 'TS-5515', po: 'PO-375' } }, 'u3'); A(st(q.id) === 'READY_FOR_APPROVAL', 'new version invalidates approval');
  dEditField(pk('pkg_1047'), 'poRef', 'PO-397', 'test', 'u7'); A(st('pkg_1047') === 'READY_FOR_APPROVAL', 'manual PO correction resolves UNKNOWN');
}

/* ---------- init ---------- */
try { selfTest(); } catch (err) { console.warn('self-check crashed', err); }
reset();
if (!location.hash) history.replaceState(null, '', '#/web/overview');
render();
</script>
