name: payproof

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payproof}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payproof}
      POSTGRES_DB: ${POSTGRES_DB:-payproof}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./.data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

  minio:
    # MinIO stopped publishing images to Docker Hub/quay; Chainguard builds are maintained.
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-payproof}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-payproof-secret}
      MC_HOST_local: http://${S3_ACCESS_KEY:-payproof}:${S3_SECRET_KEY:-payproof-secret}@localhost:9000
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./.data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 20

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${S3_ACCESS_KEY:-payproof}:${S3_SECRET_KEY:-payproof-secret}@minio:9000
    command: ["mb", "--ignore-existing", "local/${S3_BUCKET:-payproof-docs}"]
    restart: "no"

  # API + worker (one image, two targets) and the web. `make up` still starts only postgres and
  # minio; `make demo` starts everything and seeds it. The mobile app lives in its own repo and
  # runs on :3001 against this API (ADR-0002 note).
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile, target: api }
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    environment: &api_env
      ENV: ${ENV:-dev}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-payproof}:${POSTGRES_PASSWORD:-payproof}@postgres:5432/${POSTGRES_DB:-payproof}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      S3_ENDPOINT_URL: http://minio:9000 # inside the compose network
      S3_PUBLIC_ENDPOINT_URL: http://localhost:${MINIO_PORT:-9000} # what the browser opens
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-payproof}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-payproof-secret}
      S3_BUCKET: ${S3_BUCKET:-payproof-docs}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile, target: worker }
    depends_on:
      api: { condition: service_healthy } # the api container runs the migrations
    environment: *api_env

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: web
      args:
        # baked into the bundle: the address the browser (not this container) calls
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
